<style>:root{
  --plum:#3B1F4A;--plum2:#552C69;--marigold:#F2A93B;--cream:#FBF5EA;--teal:#1F7A74;--coral:#E0675A;--ink:#2A2A2A;
  --line:#EADFC9;--card:#FFFFFF;--muted:#7A6F80;--plum-soft:#EFE6F3;--teal-soft:#DDEEEC;--coral-soft:#FBE4E0;--gold-soft:#FDF0D5;--grey:#F4EFE6;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;--sans:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--plum);margin:0}
a{color:var(--teal)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:244px;flex:none;background:var(--plum);color:var(--cream);padding:18px 12px 24px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand svg{flex:none}
.brand b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1;display:block}
.brand small{letter-spacing:.32em;font-size:8.5px;opacity:.8}
.nav-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin:16px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--cream);text-decoration:none;cursor:pointer;font-size:13.5px;opacity:.88}
.nav a:hover{background:rgba(255,255,255,.08);opacity:1}
.nav a.on{background:var(--marigold);color:var(--plum);opacity:1;font-weight:600}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav a .bd{margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;font-size:10.5px;padding:0 7px;font-weight:600}
.side .foot{margin-top:auto;padding:14px 8px 0;font-size:11px;opacity:.65}
.main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1760px}
.top{display:none}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:32px;line-height:1.1}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:640px}
.page-h .sp{flex:1}
/* controls */
.btn{border:1px solid var(--plum);background:#fff;color:var(--plum);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--plum-soft)}
.btn.pri{background:var(--marigold);border-color:var(--marigold);color:var(--plum);font-weight:600}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:var(--plum);color:var(--cream)}
.btn.sm{padding:3px 11px;font-size:12px}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--coral);color:var(--coral)}
.inp,.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;min-width:0}
.inp:focus,.sel:focus,td input:focus,td select:focus{outline:2px solid var(--marigold);outline-offset:-1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 16px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--plum);border-color:var(--marigold);font-weight:600}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{font-size:19px;margin-bottom:10px}
.card h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;border-top:4px solid var(--plum)}
.kpi.t{border-top-color:var(--teal)}.kpi.c{border-top-color:var(--coral)}.kpi.m{border-top-color:var(--marigold)}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--serif);font-size:28px;color:var(--plum);line-height:1.15}
.kpi .s{font-size:12px;color:var(--muted)}
.hero{background:var(--plum);color:var(--cream);border-radius:20px;padding:24px 28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--marigold);opacity:.18}
.hero h1{color:var(--cream);font-size:38px}
.hero .sub{opacity:.85;margin-top:2px}
.hero .cd{margin-left:auto;text-align:center;background:var(--marigold);color:var(--plum);border-radius:16px;padding:10px 24px;z-index:1}
.hero .cd b{font-family:var(--serif);font-weight:400;font-size:46px;display:block;line-height:1}
.hero .cd span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.todo li:last-child{border:0}
.todo .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none;background:var(--marigold)}
.todo .dot.r{background:var(--coral)}.todo .dot.g{background:var(--teal)}
.todo b{font-weight:600}
.todo small{display:block;color:var(--muted)}
.ok-note{color:var(--teal);font-weight:500}
/* bars */
.hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.hb .n{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{flex:1;height:14px;background:var(--grey);border-radius:99px;position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hb .v{width:96px;flex:none;text-align:right;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:70vh}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.g th{position:sticky;top:0;background:var(--plum);color:var(--cream);font-weight:500;text-align:left;padding:8px 8px;white-space:nowrap;font-size:12px;z-index:2}
table.g th.f{background:var(--marigold);color:var(--plum);text-align:center}
table.g th.a{background:var(--teal)}
table.g td{border-bottom:1px solid var(--line);padding:0;vertical-align:middle;background:#fff}
table.g tr:hover td{background:#FFFBF2}
table.g td input,table.g td select{width:100%;border:0;background:transparent;padding:7px 8px;min-width:0}
table.g td input[type=number]{text-align:right}
table.g td.c{padding:7px 9px;background:var(--grey);color:#4b4350;white-space:nowrap}
table.g td.num{text-align:right}
table.g td.x{width:30px;text-align:center}
table.g td.x button{border:0;background:none;color:var(--coral);cursor:pointer;font-size:15px}
table.g td.idx{width:34px;text-align:center;color:var(--muted);font-size:11.5px;padding:0 4px}
table.g td.fc{text-align:center;padding:2px}
.yc{width:26px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:11.5px;color:var(--muted)}
.yc.Y{background:var(--gold-soft);border-color:var(--marigold);color:#8a5a00}
.yc.C{background:var(--teal);border-color:var(--teal);color:#fff}
.yc.N{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:500;background:var(--grey)}
.pill.ok{background:var(--teal-soft);color:#14524e}.pill.warn{background:var(--gold-soft);color:#8a5a00}.pill.bad{background:var(--coral-soft);color:#a8362b}.pill.info{background:var(--plum-soft);color:var(--plum)}
.note{font-size:12.5px;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.row2{display:flex;gap:14px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field .inp,.field .sel{font-size:14px;color:var(--ink)}
/* vendor compare */
.vc{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:#fff;position:relative}
.vc.sel{border:2px solid var(--teal);background:#F4FBFA}
.vc.low:before{content:"Lowest price";position:absolute;top:-10px;right:12px;background:var(--marigold);color:var(--plum);font-size:11px;font-weight:600;padding:1px 10px;border-radius:99px}
.vc .p{font-family:var(--serif);font-size:26px;color:var(--plum)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(59,31,74,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--cream);border-radius:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h2{font-size:26px;margin-bottom:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--plum);color:var(--cream);padding:9px 20px;border-radius:99px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:13px}
.banner{background:var(--gold-soft);border:1px solid var(--marigold);border-radius:12px;padding:9px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner .sp{flex:1}
textarea.inp{width:100%;min-height:90px;font-size:13px}
/* print */
.print-sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px;max-width:820px}
.print-sheet h1{font-size:40px;text-align:center}
.print-sheet .d{text-align:center;color:var(--muted);margin-bottom:18px}
.print-sheet table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:13px}
.print-sheet th{background:var(--plum);color:var(--cream);text-align:left;padding:6px 8px;font-weight:500}
.print-sheet td{border-bottom:1px solid var(--line);padding:6px 8px}
@media print{
  .side,.top,.page-h .btn,.noprint,.banner{display:none!important}
  .main{padding:0;max-width:none}.print-sheet{border:0;padding:0;max-width:none}
  body{background:#fff}
}
@media (max-width:900px){
  .side{position:fixed;left:-260px;top:0;z-index:40;transition:left .2s;height:100%}
  .side.open{left:0}
  .top{display:flex;align-items:center;gap:10px;background:var(--plum);color:var(--cream);padding:10px 14px;position:sticky;top:0;z-index:30}
  .top b{font-family:var(--serif);font-weight:400;font-size:20px}
  .top button{background:none;border:0;color:var(--cream);font-size:22px;cursor:pointer}
  .app{display:block}
  .main{padding:16px 12px 60px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g32{grid-template-columns:1fr}
  .hero h1{font-size:28px}.hero .cd{margin-left:0}
  .hb .n{width:100px}.hb .v{width:80px}
}
table.g th.s,table.g td.s{position:sticky;left:34px;z-index:1;box-shadow:1px 0 0 var(--line)}
table.g th.s{z-index:3}
table.g td.s{background:#fff}
table.g td.s input{font-weight:500}
code{background:var(--grey);padding:1px 6px;border-radius:6px;font-size:12px}
.card h3 small{font-family:var(--sans)}

/* ---------- v2: banded rows (like Excel tables) ---------- */
table.g tbody tr:nth-child(even) td{background:#FAF4E8}
table.g tbody tr:nth-child(even) td.c{background:#F1EADC}
table.g tbody tr:hover td{background:#FFF6E3}
table.g th.cu{background:var(--plum2)}
.print-sheet tr:nth-child(even) td,.st tbody tr:nth-child(even) td{background:#FAF4E8}
/* grid toolbar */
.gw{margin-bottom:6px}
.gtools{display:flex;align-items:center;gap:8px;margin:0 0 6px;min-height:28px}
.gtools .sp{flex:1}
/* column editor */
.ce{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;padding:2px}
.cer{display:flex;gap:6px;align-items:center}
.cer input[type=checkbox]{width:18px;height:18px;accent-color:#1F7A74;flex:none}
.cer .inp{flex:1;padding:6px 9px}
.cer .btn{padding:3px 9px}
.btn:disabled{opacity:.4;cursor:default}
/* cards (phones) */
.cards{display:flex;flex-direction:column;gap:8px}
.cr{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cr:nth-child(even){background:#FFFCF6}
.cr .ch{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cr .ct{flex:1;min-width:0}
.cr .ct b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .ct small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .chev{font-size:22px;color:var(--muted);transition:transform .15s;line-height:1}
.cr.on .chev{transform:rotate(90deg)}
.cr.on{border-color:var(--marigold);box-shadow:0 4px 16px rgba(59,31,74,.08)}
.cb{border-top:1px dashed var(--line);padding:8px 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;font-size:15px;min-height:40px}
.fld input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:#1F7A74}
.fld.c .fv,.fld.h .fv{padding:6px 0;font-size:14px;color:#4b4350}
.fld.fc{flex-direction:row;align-items:center;gap:8px}
.fld.fc label{order:2;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)}
.cfoot{grid-column:1/-1;display:flex;justify-content:flex-end;padding-top:4px}
.ck{width:18px;height:18px;accent-color:#1F7A74}
/* sign-in / gate */
#gate{display:none;position:fixed;inset:0;z-index:70;background:var(--plum);align-items:center;justify-content:center;padding:20px;overflow:auto}
#gate:before{content:"";position:fixed;right:-120px;top:-120px;width:380px;height:380px;border-radius:50%;background:var(--marigold);opacity:.16}
.gated .app,.gated .top{display:none}
.gcard{background:var(--cream);border-radius:24px;max-width:430px;width:100%;padding:26px 26px 22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.gbrand{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--plum)}
.gbrand b{font-family:var(--serif);font-weight:400;font-size:22px;display:block;line-height:1}.gbrand small{letter-spacing:.32em;font-size:8.5px}
.gbrand svg rect:first-child{fill:#3B1F4A}.gbrand svg text{fill:#FBF5EA}
.gcard h1{font-size:30px;line-height:1.15;margin-bottom:6px}
.gcard form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.gcard .inp{font-size:16px;padding:11px 12px}
.inp.code{font-size:26px;letter-spacing:10px;text-align:center}
.btn.wide{width:100%;padding:11px 15px;font-size:14.5px;margin-top:6px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0 6px}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:8px;margin:14px 0 6px}
.pitem{display:block;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit}
.pitem:hover{border-color:var(--marigold)}
.pitem b{display:block;font-weight:600;color:var(--plum)}.pitem small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
/* sidebar plan chip + sync */
#planchip{padding:0 8px 6px}
.pc{display:block;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--cream);text-decoration:none;cursor:pointer;line-height:1.4}
.pc:hover{background:rgba(255,255,255,.14)}
.pc .up{display:inline-block;background:var(--marigold);color:var(--plum);border-radius:99px;padding:0 8px;font-weight:600;margin-left:4px}
.sync{font-size:11.5px;margin-bottom:8px;opacity:.95}
.sync.offline,.sync.error{color:#FFB4A8}
.top .sp{flex:1}
#sync-m{font-size:15px;margin:0;opacity:.9}
/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.plan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;display:flex;flex-direction:column}
.plan.hot{border:2px solid var(--marigold)}
.plan .pb{position:absolute;top:-10px;right:12px;background:var(--marigold);color:var(--plum);font-size:11px;font-weight:600;padding:1px 10px;border-radius:99px}
.plan .pp{font-family:var(--serif);font-size:32px;color:var(--plum)}
.plan ul{padding-left:18px;margin:8px 0 12px;font-size:13px;flex:1}
.modal{max-width:760px}
.banner.bad{background:var(--coral-soft);border-color:var(--coral)}
.act li{align-items:center}
/* read-only (view-only, plan ended, support) */
.ro .page-h .btn.pri:not(.keep),.ro .btn.pri:not(.keep),.ro [data-act],.ro [data-set],.ro .colbtn,.ro [data-x=fresh],.ro [data-x=demo],.ro label.btn.pri{display:none!important}
.ro .yc{pointer-events:none}
.ro a[data-act=wa]{display:inline-block!important}
@media (max-width:760px){
  .g3,.g32{grid-template-columns:minmax(0,1fr)}
  .card{min-width:0}
  .print-sheet{overflow-x:auto}
  .page-h h1{font-size:26px}
  .page-h{gap:8px}
  .kpi .v{font-size:23px}
  .kpi{padding:10px 12px}
  .bar .inp,.bar .sel{flex:1 1 140px}
  .bar input[type=search]{flex-basis:100%;min-width:0!important}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tabs button{white-space:nowrap;padding:8px 12px}
  .vc{margin-top:6px}
  .grid.g3:has(.vc){grid-template-columns:1fr}
  .cb{grid-template-columns:1fr}
  /* static tables become stacked cards */

/* features */

.lp-vscol.bad li:before{content:"✕";position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:#F6D5CF;color:#B5473B;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

.lp-vscol.good{background:var(--teal-soft);border:1px solid #BFDDD9}

.lp-vscol.good b{color:var(--plum)}
.lp-band{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:34px;background:linear-gradient(120deg,var(--plum),var(--plum2));color:var(--cream);border-radius:20px;padding:20px 24px}

.lp-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lp-rcard,.lp-wcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.lp-rcard span,.lp-wcard span{font-size:30px;display:block;margin-bottom:6px}
.lp-rcard b,.lp-wcard b{display:block;color:var(--plum);font-size:17px}
.lp-rcard p,.lp-wcard p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.lp-featsec{background:#fff;border-block:1px solid var(--line)}
.lp-who .lp-g3{margin-top:28px}
.lp-wcard{background:var(--cream)}
.lp-paynote{color:var(--muted);font-size:13.5px;margin-top:22px}
.lp-stars{color:var(--marigold);letter-spacing:2px;margin-bottom:6px}

/* problem */
.lp-prob{background:#fff;border-block:1px solid var(--line)}
.lp-prob h2{text-align:center;margin-bottom:28px}
.lp-pcard{background:var(--cream);border-radius:20px;padding:24px;border:1px solid var(--line)}
.lp-pcard span{font-size:30px;display:block;margin-bottom:8px}
.lp-pcard b{display:block;font-size:17px;color:var(--plum);line-height:1.35}
.lp-pcard p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.lp-sum{text-align:center;font-family:var(--serif);font-size:clamp(20px,2.2vw,26px);color:var(--plum);margin:34px auto 0;max-width:640px;line-height:1.3}

/* features */
.lp-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:26px 0 34px}
.lp-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500;font-size:14px;color:var(--plum)}
.lp-tabs button[aria-selected=true]{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.lp-feat{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:center;max-width:920px;margin:0 auto}
.lp-feat-vis{display:flex;justify-content:center}
.lp-feat-txt h3{font-size:34px;margin-bottom:4px}
.lp-hing{font-family:var(--serif);font-size:21px;color:var(--coral);margin:0 0 6px}
.lp-feat-txt .lp-ctas{align-items:center;margin-top:8px}
.lp-feat-txt .lp-link{background:none;border:0;cursor:pointer}
.lp-also{max-width:820px;margin:40px auto 0;text-align:center;background:var(--gold-soft);border-radius:16px;padding:16px 20px;font-size:14.5px;color:#5b4f3a}
.lp-also b{color:var(--plum)}

/* family */
.lp-fam{background:var(--plum);color:var(--cream);position:relative;overflow:hidden}
.lp-fam:before{content:"";position:absolute;right:-160px;top:-160px;width:460px;height:460px;border-radius:50%;background:var(--marigold);opacity:.12}
.lp-fam h2{color:var(--cream)!important}
.lp-fam em{color:var(--marigold)!important}
.lp-fam .lp-eyebrow{color:var(--marigold)}
.lp-fam p{color:#e6dcec}
.lp-fam .lp-ctas{margin-top:20px}
.lp-fam .lp-ticks li:before{background:rgba(242,169,59,.2);color:var(--marigold)}
.lp-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;position:relative}
.lp-famcard{background:var(--cream);border-radius:22px;padding:10px 18px;box-shadow:0 24px 60px rgba(0,0,0,.3);color:var(--ink)}
.lp-act{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.lp-act:last-child{border:0}
.lp-act i{flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font-style:normal;font-weight:600;display:flex;align-items:center;justify-content:center}
.lp-act b{color:var(--plum)}
.lp-act small{display:block;color:var(--muted);font-size:12.5px}

/* steps */
.lp-steps{margin-top:30px}
.lp-ctas.c{justify-content:center;margin-top:30px}
.lp-steps>div{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px}
.lp-steps span{width:40px;height:40px;border-radius:50%;background:var(--marigold);color:var(--plum);font-family:var(--serif);font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.lp-steps b{display:block;color:var(--plum);font-size:17px}
.lp-steps p{margin:6px 0 0;color:var(--muted);font-size:14.5px}

/* devices */
.lp-dev{background:#fff;border-block:1px solid var(--line)}
.lp-browser{max-width:980px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(59,31,74,.22);border:1px solid var(--line);background:#fff}
.lp-bbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--grey);border-bottom:1px solid var(--line)}
.lp-bbar i{width:11px;height:11px;border-radius:50%;background:#e2d6c2}
.lp-bbar span{margin-left:10px;background:#fff;border-radius:8px;padding:3px 12px;font-size:12px;color:var(--muted)}
.lp-browser img{display:block;width:100%;height:auto;aspect-ratio:16/10}
.lp-excel{display:flex;gap:16px;align-items:flex-start;max-width:760px;margin:40px auto 0;background:var(--teal-soft);border-radius:18px;padding:20px 22px}
.lp-excel span{font-size:30px}
.lp-excel b{color:var(--plum);font-size:17px}
.lp-excel p{margin:4px 0 0;font-size:14.5px;color:#36524f}

.lp-plan .lp-ticks{flex:1;font-size:14.5px}

.lp-q small{color:var(--muted)}

.lp-faq summary::-webkit-details-marker{display:none}
.lp-faq summary:after{content:"+";font-size:22px;line-height:1;color:var(--marigold)}

  .lp-float{font-size:12px;padding:8px 10px}

  .lp-sticky{display:block}

    const raw = (r.a.Confirmed + r.k.Confirmed * c.childPct + (r.a.Pending + r.k.Pending * c.childPct) * c.share) * (1 + num(c.buffer));
    r.plates = r.meal === 'No meal' ? 0 : Math.ceil(raw - 1e-9);
    r.food = r.plates * r.costPer;
    return r;
  });
  /* stay */
  const hk = h => h.hotel + ' - ' + h.type;
  o.hotelKey = hk;
  o.stayNeed = new Map();
  G.forEach(g => { if (g.stay === 'Yes') o.stayNeed.set(gk(g), (o.stayNeed.get(gk(g)) || 0) + 1); });
  o.stayNeedN = Array.from(o.stayNeed.values()).reduce((a, b) => a + b, 0);
  o.roomCalc = {};
  S.roomAlloc.forEach(a => {
    const h = S.hotels.find(x => hk(x) === a.hotelType);
    const nights = a.in && a.out ? Math.max(0, diff(pd(a.out), pd(a.in))) : 0;
    const rooms = num(a.rooms), cap = h ? rooms * num(h.pax) : 0, need = o.stayNeed.get(a.group) || 0;
    const cost = h ? rooms * num(h.rate) * nights : 0;
    const status = !a.group ? 'Pick a group' : !h ? 'Pick a room type' : !a.in || !a.out ? 'Add dates' : need > cap ? 'Needs more beds' : 'OK';
    o.roomCalc[a.id] = { need, cap, nights, cost, status };
  });
  o.roomCost = S.roomAlloc.reduce((s, a) => s + o.roomCalc[a.id].cost, 0);
  const allocG = new Set(S.roomAlloc.map(a => a.group));
  o.stayAwait = Array.from(o.stayNeed.entries()).filter(e => !allocG.has(e[0]));
  o.hotelBooked = {};
  S.roomAlloc.forEach(a => { o.hotelBooked[a.hotelType] = (o.hotelBooked[a.hotelType] || 0) + num(a.rooms); });
  o.roomsTotal = S.hotels.reduce((s, h) => s + num(h.rooms), 0);
  o.roomsBooked = S.roomAlloc.reduce((s, a) => s + num(a.rooms), 0);
  /* transport */
  const vk = v => v.operator + ' - ' + v.type;
  o.vehKey = vk;
  o.trNeed = new Map();
  G.forEach(g => { if (g.transport === 'Yes') o.trNeed.set(gk(g), (o.trNeed.get(gk(g)) || 0) + 1); });
  o.trNeedN = Array.from(o.trNeed.values()).reduce((a, b) => a + b, 0);
  o.trCalc = {};
  S.transAlloc.forEach(a => {
    const v = S.vehicles.find(x => vk(x) === a.vehicle);
    const trips = Math.max(1, (a.arrDate ? 1 : 0) + (a.depDate ? 1 : 0));
    const n = num(a.count), cap = v ? n * num(v.seats) : 0, need = o.trNeed.get(a.group) || 0;
    const cost = v ? n * num(v.rate) * trips : 0;
    const status = !a.group ? 'Pick a group' : !v ? 'Pick a vehicle' : need > cap ? 'Needs more seats' : 'OK';
    o.trCalc[a.id] = { need, cap, trips, cost, status };
  });
  o.trCost = S.transAlloc.reduce((s, a) => s + o.trCalc[a.id].cost, 0);
  const trG = new Set(S.transAlloc.map(a => a.group));
  o.trAwait = Array.from(o.trNeed.entries()).filter(e => !trG.has(e[0]));
  o.vehBooked = {};
  S.transAlloc.forEach(a => { o.vehBooked[a.vehicle] = (o.vehBooked[a.vehicle] || 0) + num(a.count); });
  /* payments */
  o.payCalc = {};
  S.payments.forEach(p => {
    const paid = p.status === 'Paid';
    const dd = p.due ? diff(pd(p.due), o.T) : null;
    const st = paid ? 'Paid' : dd == null ? 'No due date' : dd < 0 ? 'Overdue' : dd <= 7 ? 'Due this week' : dd <= 30 ? 'Due this month' : 'Upcoming';
    o.payCalc[p.id] = { st, dd, paid };
  });
  /* budget */
  const total = num(S.totalBudget);
  o.total = total;
  o.cats = S.budgetCats.map(c => ({ c, planned: total * num(c.pct), committed: 0, paid: 0, lines: 0, sub: 0 }));
  const cmap = {}; o.cats.forEach(x => { cmap[x.c.name] = x; });
  o.lineCalc = {};
  S.budgetLines.forEach(l => {
    const cat = cmap[l.cat];
    const planned = cat ? cat.planned * num(l.pctCat) : 0;
    let committed;
    if (l.source === 'Hotels') committed = o.roomCost;
    else if (l.source === 'Transport') committed = o.trCost;
    else committed = S.vendors.filter(v => v.line === l.line && v.decision === 'Selected').reduce((s, v) => s + (num(v.negotiated) || num(v.quoted)), 0);
    const paid = S.payments.filter(p => p.line === l.line && p.status === 'Paid').reduce((s, p) => s + num(p.amount), 0);
    o.lineCalc[l.id] = { planned, committed, paid };
    if (cat) { cat.committed += committed; cat.paid += paid; cat.lines++; cat.sub += num(l.pctCat); }
  });
  o.pctSum = S.budgetCats.reduce((s, c) => s + num(c.pct), 0);
  o.planned = o.cats.reduce((s, x) => s + x.planned, 0);
  o.committed = o.cats.reduce((s, x) => s + x.committed, 0);
  o.paid = o.cats.reduce((s, x) => s + x.paid, 0);
  o.catStatus = x => !x.planned ? 'No budget' : !x.committed ? 'Not started' : x.committed > x.planned ? 'Over budget' : x.committed / x.planned >= 0.9 ? 'Near limit' : 'On track';
  /* vendors */
  o.vCalc = {};
  const byLine = {};
  S.vendors.forEach(v => { (byLine[v.line] = byLine[v.line] || []).push(v); });
  S.vendors.forEach(v => {
    const eff = num(v.negotiated) || num(v.quoted), arr = byLine[v.line] || [];
    const effs = arr.map(x => num(x.negotiated) || num(x.quoted)).filter(x => x > 0);
    const avg = effs.length ? effs.reduce((a, b) => a + b, 0) / effs.length : 0;
    const rank = effs.filter(x => x < eff).length + 1;
    const lp = S.budgetLines.find(l => l.line === v.line);
    const planned = lp ? o.lineCalc[lp.id].planned : 0;
    const paid = S.payments.filter(p => p.line === v.line && p.payee === v.vendor && p.status === 'Paid').reduce((s, p) => s + num(p.amount), 0);
    const sel = v.decision === 'Selected';
    o.vCalc[v.id] = { eff, rank, vsAvg: avg && eff ? eff / avg - 1 : null, vsPlan: planned && eff ? eff / planned - 1 : null, paid, bal: sel ? eff - paid : null, st: !sel ? '' : paid >= eff && eff > 0 ? 'Fully paid' : paid > 0 ? 'Part-paid' : 'Unpaid', low: effs.length > 1 && eff === Math.min.apply(null, effs) };
  });
  /* tasks */
  o.tCalc = {};
  S.tasks.forEach(t => {
    const dl = taskDeadline(t, o), done = t.status === 'Done';
    const left = dl ? diff(dl, o.T) : null;
    const alert = done ? 'Done' : left == null ? '' : left < 0 ? 'Overdue' : left <= 7 ? 'Due soon' : 'On track';
    o.tCalc[t.id] = { dl, left, alert };
  });
  o.tDone = S.tasks.filter(t => t.status === 'Done').length;
  o.tOver = S.tasks.filter(t => o.tCalc[t.id].alert === 'Overdue').length;
  o.tSoon = S.tasks.filter(t => o.tCalc[t.id].alert === 'Due soon').length;
  /* money life */
  o.payOver = S.payments.filter(p => o.payCalc[p.id].st === 'Overdue');
  o.paySoon = S.payments.filter(p => { const c = o.payCalc[p.id]; return !c.paid && c.dd != null && c.dd >= 0 && c.dd <= 14; });
  o.payPending = S.payments.filter(p => p.status !== 'Paid').reduce((s, p) => s + num(p.amount), 0);
  o.payPaid = S.payments.filter(p => p.status === 'Paid').reduce((s, p) => s + num(p.amount), 0);
  o.shRecv = S.shagun.filter(x => x.dir === 'Received').reduce((s, x) => s + num(x.amount), 0);
  o.shGiven = S.shagun.filter(x => x.dir === 'Given').reduce((s, x) => s + num(x.amount), 0);
  o.thanksPending = S.shagun.filter(x => x.dir === 'Received' && x.thanks !== 'Yes').length;
  o.returnsPending = S.shagun.filter(x => x.ret === 'Yes' && x.retStatus !== 'Done').length;
  o.noVendorLines = S.budgetLines.filter(l => l.source !== 'Hotels' && l.source !== 'Transport' && S.vendors.some(v => v.line === l.line) && !S.vendors.some(v => v.line === l.line && v.decision === 'Selected'));
  return o;
}

const serial = s => { const d = pd(s); return d ? Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1899, 11, 30)) / 864e5) : null; };
const fromSerial = n => { const t = new Date(Math.round(n) * 864e5 + Date.UTC(1899, 11, 30)); return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0') + '-' + String(t.getUTCDate()).padStart(2, '0'); };
const tSerial = s => { const m = /^(\d{1,2}):(\d\d)/.exec(s || ''); return m ? (+m[1] * 60 + +m[2]) / 1440 : null; };
const fromT = n => { const mins = Math.round(n * 1440) % 1440; return String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0'); };

function cellVal(ws, r, c, t) {
  const a = ws[XLSX.utils.encode_cell({ r: r - 1, c: c - 1 })];
  if (!a || a.v == null || a.v === '') return null;
  let v = a.v;
  if (t === 'd') { if (typeof v === 'number') return fromSerial(v); if (v instanceof Date) return fd(v); return String(v).slice(0, 10); }
  if (t === 't') { if (typeof v === 'number') return fromT(v); return String(v).slice(0, 5); }
  if (t === 'n') return typeof v === 'number' ? v : (isFinite(parseFloat(v)) ? parseFloat(v) : null);
  if (t === 'p') return typeof v === 'number' ? v : (isFinite(parseFloat(v)) ? parseFloat(v) / (String(v).indexOf('%') > 0 ? 100 : 1) : null);
  return typeof v === 'number' ? String(v) : String(v).trim();
}

function readTable(wb, sp) {
  let ws = wb.Sheets[sp.sheet], hdr = sp.hdr;
  if (!ws && sp.altSheet && wb.Sheets[sp.altSheet]) { ws = wb.Sheets[sp.altSheet]; hdr = sp.altHdr; }
  if (!ws) return null;
  const stopCol = sp.cols.find(c => c[0] === sp.stop)[1];
  const rows = [];
  for (let r = hdr + 1; r < hdr + 3000; r++) {
    const sv = cellVal(ws, r, stopCol, 's');
    if (!sv) { if (r > hdr + 1 || true) break; }
    if (sp.skip && sv === sp.skip) continue;
    const row = { id: uid() };
    sp.cols.forEach(c => { const v = cellVal(ws, r, c[1], c[2]); if (v != null) row[c[0]] = v; });
    if (sp.fnCols) {
      row.fn = {};
      for (let c = sp.fnCols[0]; c <= sp.fnCols[1]; c++) {
        const name = cellVal(ws, hdr, c, 's'), v = cellVal(ws, r, c, 's');
        if (name && v && /^[YCN]$/i.test(v)) row.fn[name] = v.toUpperCase();
      }
    }
    rows.push(row);
  }
  return rows;
}

// The Excel library (250 KB) loads only when someone imports or exports, not on every visit.
// It is in the offline worker's cache, so this also works offline once the planner has been opened.
let xlsxLoading = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return xlsxLoading || (xlsxLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = '/planner/xlsx.mini.min.js';
    s.onload = () => resolve();
    s.onerror = () => { xlsxLoading = null; s.remove(); reject(new Error('the Excel tool did not load. Check your connection and try again')); };
    document.head.appendChild(s);
  }));
}

async function importWorkbook(buf) {
  await loadXlsx();
  const wb = XLSX.read(buf, { type: 'array' });
  const st = copy(S);
  let found = 0;
  const sh = wb.Sheets['Start Here'];
  if (sh) {
    const g = (a, t) => { const c = sh[a]; if (!c || c.v == null || c.v === '') return ''; if (t === 'd') return typeof c.v === 'number' ? fromSerial(c.v) : String(c.v).slice(0, 10); return String(c.v); };
    // Only plain values (not formulas) are read
    st.settings = { bride: g('C6'), groom: g('C7'), date: g('C8', 'd'), city: g('C9'), start: g('C10', 'd') || st.settings.start };
    found++;
  }
  SPEC.forEach(sp => {
    const rows = readTable(wb, sp);
    if (rows) { st[sp.coll] = rows; found++; }
  });
  const bp = wb.Sheets['Budget Planner'];
  if (bp) { const v = cellVal(bp, 4, 3, 'n'); if (v != null) st.totalBudget = v; }
  const ls = wb.Sheets['Lists'];
  if (ls) {
    const team = [];
    for (let c = 1; c < 40; c++) {
      if (cellVal(ls, 3, c, 's') === 'Family Members & Team') { for (let r = 4; r < 120; r++) { const v = cellVal(ls, r, c, 's'); if (v) team.push(v); } }
    }
    if (team.length) { st.team = team; const had = st.people || []; st.people = teamToPeople(team).map(p => had.find(x => x.name === p.name) || p); }
  }
  const ct = wb.Sheets['Catering'];
  if (ct) {
    const a = cellVal(ct, 6, 3, 'n'), b = cellVal(ct, 7, 3, 'n'), c2 = cellVal(ct, 8, 3, 'n');
    if (a != null) st.cat.share = a; if (b != null) st.cat.childPct = b; if (c2 != null) st.cat.buffer = c2;
    for (let r = 12; r < 40; r++) {
      const nm = cellVal(ct, r, 2, 's'); if (!nm) break;
      const meal = cellVal(ct, r, 4, 's'), cost = cellVal(ct, r, 11, 'n');
      if (meal || cost != null) st.cat.perFn[nm] = { meal: meal || 'Dinner', cost: cost || 0 };
    }
  }
  if (!found) throw new Error('This does not look like a Pandora Wedding Planner workbook.');
  st.demo = false;
  return normalize(st);
}

function sheetFrom(rows, hdrRow, spec, extra) {
  const maxc = Math.max.apply(null, spec.map(c => c[1]).concat(extra ? [extra.to] : [0]));
  const aoa = [];
  for (let i = 0; i < hdrRow - 1; i++) aoa.push([]);
  const head = new Array(maxc).fill(null);
  spec.forEach(c => { head[c[1] - 1] = c[3]; });
  if (extra) extra.names.forEach((n, i) => { head[extra.from - 1 + i] = n; });
  aoa.push(head);
  rows.forEach(r => {
    const line = new Array(maxc).fill(null);
    spec.forEach(c => {
      let v = r[c[0]]; if (v === undefined || v === '') return;
      if (c[2] === 'd') v = serial(v); else if (c[2] === 't') v = tSerial(v); else if (c[2] === 'n' || c[2] === 'p') v = num(v);
      line[c[1] - 1] = v;
    });
    if (extra) extra.names.forEach((n, i) => { const v = (r.fn || {})[n]; if (v) line[extra.from - 1 + i] = v; });
    aoa.push(line);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  spec.forEach(c => {
    for (let i = 0; i < rows.length; i++) {
      const a = ws[XLSX.utils.encode_cell({ r: hdrRow + i, c: c[1] - 1 })];
      if (!a) continue;
      if (c[2] === 'd') a.z = 'dd-mmm-yyyy'; else if (c[2] === 't') a.z = 'hh:mm'; else if (c[2] === 'p') a.z = '0.0%'; else if (c[2] === 'n' && /price|amount|cost|rate|Rs/i.test(c[3])) a.z = '#,##0';
    }
  });
  ws['!cols'] = new Array(maxc).fill({ wch: 20 });
  return ws;
}

  const wb = XLSX.utils.book_new();
  const readme = XLSX.utils.aoa_to_sheet([

    ['This file holds your data from the web planner. You can edit it and import it back (Setup & Data > Import).'],

/* ===== grid.js ===== */
/* ---------- editable grid: a table on computers, tap-to-open cards on phones ---------- */
const MOBILE = () => window.innerWidth < 760;
const colId = c => c.id || c.k;
const RO = () => !!(typeof CLOUD !== 'undefined' && CLOUD.readOnly);
const dis = () => RO() ? ' disabled' : '';
const CUSTOM_TYPES = [['text', 'Text'], ['num', 'Number'], ['date', 'Date'], ['sel', 'Dropdown'], ['yn', 'Yes / No']];

function colPrefs(key) { return (S.cols && S.cols[key]) || {}; }

/** The grid's columns after the user's choices: order, renamed headers, hidden columns and their own extra columns. */

  const rank = c => { const i = order.indexOf(colId(c)); return i < 0 ? 1000 + pos.get(colId(c)) : i; };
  return cols.slice().sort((a, b) => rank(a) - rank(b)).map(c => (p.labels && p.labels[colId(c)] ? Object.assign({}, c, { label: p.labels[colId(c)], def: c.label }) : c));
}
const visibleCols = (key, base) => { const h = colPrefs(key).hidden || {}; return allCols(key, base).filter(c => !h[colId(c)]); };

function columnEditor(key, base, coll, onDone) {

  let list = allCols(key, base).map(c => ({ id: colId(c), label: c.label, def: c.def || c.label, custom: c.custom }));
  const m = modal('<h2>Columns</h2><p class="note" style="margin-top:0">Tick to show, type to rename, use the arrows to reorder. Changes apply for everyone on this planner.</p><div class="ce"></div>' +
    '<div class="card" style="margin-top:12px;padding:12px 14px"><b style="font-size:13px">Add your own column</b><div class="row2" style="margin-top:6px;align-items:flex-end"><label class="field">Name<input class="inp" data-n placeholder="e.g. Gift sent"></label><label class="field">Type<select class="sel" data-t>' + CUSTOM_TYPES.map(t => '<option value="' + t[0] + '">' + t[1] + '</option>').join('') + '</select></label><label class="field" data-ow style="display:none;flex:1;min-width:160px">Options (comma separated)<input class="inp" data-o placeholder="Yes, No, Maybe"></label><button class="btn" data-add>+ Add</button></div></div>' +

    delete p.dropped;
    S.cols = Object.assign({}, S.cols || {}, { [key]: p });
    dirty(); m.remove(); onDone(); toast('Columns saved');
  };
}

function grid(cfg) {

      default: {

  const pillHtml = (r, i) => { const pc = pillCol(); return cfg.pill ? cfg.pill(r) : pc ? calcHtml(pc, r, i) : ''; };

  }

/* ---------- UI toolkit ---------- */
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
let toastT = null, lastDel = null;
function toast(msg, actionLabel, fn) {
  $$('.toast').forEach(x => x.remove());
  const t = el('<div class="toast">' + esc(msg) + (actionLabel ? ' &nbsp;<a href="#" style="color:#F2A93B;font-weight:600">' + esc(actionLabel) + '</a>' : '') + '</div>');
  if (actionLabel) t.querySelector('a').onclick = e => { e.preventDefault(); fn(); t.remove(); };
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), actionLabel ? 6000 : 2600);
}
function modal(html) {

/* ---------- starting up ---------- */
async function openPlanner(id, preload) {
  try {
    const r = preload || await api('/planners/' + id);
    CLOUD.on = true; CLOUD.id = id; CLOUD.myRevs = new Set(); undoClear();
    applyMeta(r.meta);
    store.set('pp_last', id);
    let cache = null; try { cache = JSON.parse(store.get('pp_cache_' + id) || 'null'); } catch (e) { cache = null; }
    if (cache && cache.rev === r.rev && cache.base) { CLOUD.base = cache.base; S = normalize(cache.state); CLOUD.forceReplace = !!cache.forceReplace; }
    else if (r.state) { CLOUD.base = stripLocal(normalize(copy(r.state))); S = normalize(copy(r.state)); }
    else { CLOUD.base = null; S = freshState(); }
    S.demo = false; CLOUD.rev = r.rev || 0; D = null;
    saveCache(); // keep a copy on this device straight away, so the planner opens with no internet next time
    INV = { linked: false, loaded: false }; INV_AT = 0;
    hideLanding(); ungate(); renderAll(); setSync(CLOUD.readOnly ? 'ro' : 'saved'); startPolling(); maybeTour(); invAfterOpen();
    if (!CLOUD.readOnly && diffOps(CLOUD.base, stripLocal(S)).length) schedulePush();
  } catch (e) {
    if (e.status === 401) return signOut(true);
    if (e.status === 0) return openCached(id) || startLocal('Couldn’t reach the server. Showing what’s saved on this device.');
    toast(e.message); store.del('pp_last'); startCloud(true);
  }
}

async function startCloud(noAuto) {
  try {
    const me = await api('/me');
    CLOUD.email = me.email; CLOUD.list = me.planners || [];
    if (me.support) return openPlanner(CLOUD.list[0].id);
    const last = store.get('pp_last');
    if (!noAuto && last && CLOUD.list.some(p => p.id === last)) return openPlanner(last);
    if (CLOUD.list.length === 1 && !noAuto) return openPlanner(CLOUD.list[0].id);
    if (CLOUD.list.length) return pickScreen(CLOUD.list);
    return trialScreen();
  } catch (e) {
    if (e.status === 401) return signOut(true);
    if (e.status === 0 && openCached()) return;
    return startLocal(e.status === 0 ? null : e.message);
  }
}

function startLocal(msg) {
  clearInterval(CLOUD.pollT); CLOUD.on = false; CLOUD.readOnly = false; document.body.classList.remove('ro');
  S = load(); D = null; undoClear(); hideLanding(); ungate(); renderAll(); setSync('local'); maybeTour();
  if (msg) toast(msg);
}

function signOut(expired) {
  clearInterval(CLOUD.pollT); clearTimeout(CLOUD.pushT);
  if (CLOUD.on && CLOUD.id) store.del('pp_cache_' + CLOUD.id);
  store.del(TOKEN_KEY); store.del('pp_last'); try { sessionStorage.removeItem('pp_support'); } catch (e) { /* ignore */ }
  CLOUD.on = false; CLOUD.meta = null; CLOUD.readOnly = false; document.body.classList.remove('ro');
  signInScreen(expired ? 'Please sign in again.' : '');
}

async function cloudBoot() {
  const h = location.hash;
  if (h.indexOf('#support=') === 0) { try { sessionStorage.setItem('pp_support', h.slice(9)); } catch (e) { /* ignore */ } try { history.replaceState(null, '', '#dash'); } catch (e) { /* ignore */ } }
  if (location.protocol === 'file:') return startLocal();
  if (token()) return startCloud();
  // Sign-up / sign-in pages. Old email links using /planner#signin go to /planner/login.
  if (h === '#signin') { location.replace('/planner/login' + location.search); return; }
  if (SIGN_PAGE()) { track('PageView'); return signInScreen(); }
  // Everyone else signed out: the landing page, shown straight away (no waiting on the server).
  landingScreen();
}

let RZP_LOADING = null;
function loadRazorpay() {
  if (window.Razorpay) return Promise.resolve();
  RZP_LOADING = RZP_LOADING || new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js'; s.onload = ok; s.onerror = () => { RZP_LOADING = null; bad(new Error('Couldn’t load the payment window. Check your connection.')); }; document.body.appendChild(s); });

    (owner ? '<button class="btn pri wide keep" data-buy="' + esc(p.id) + '">' + (cur.id === p.id && CLOUD.meta.status !== 'expired' ? 'Renew' : 'Choose ' + esc(p.name)) + '</button>' : '') + '</div>').join('') + (typeof invBundleCard === 'function' ? invBundleCard(owner) : '');
  $('.plans', m).insertAdjacentHTML('afterend', owner ? '<div class="row2" style="margin-top:12px;align-items:flex-end"><label class="field">Promo code (optional)<input class="inp" data-coupon style="text-transform:uppercase"></label></div>' : '<p class="note">Only the planner’s owner (' + esc(CLOUD.meta.owner) + ') can upgrade. Ask them to open Plan &amp; billing.</p>');
  $$('[data-buy]', m).forEach(b => b.onclick = async () => {
    b.disabled = true; const label = b.textContent; b.textContent = 'Opening payment…';
    try {
      const coupon = ($('[data-coupon]', m) || {}).value || '';
      const o = await api('/planners/' + CLOUD.id + '/checkout', { method: 'POST', body: { plan: b.dataset.buy, coupon } });

          r.open();
        });

      await api('/planners/' + CLOUD.id + '/verify', { method: 'POST', body: res });
      m.remove(); track('Purchase', { value: o.total || 0, currency: 'INR' }); await poll(true); renderAll(); toast('🎉 Your plan is active. Thank you!');
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = label; }
  });
}

(function rememberSource() {
  try {
    const q = new URLSearchParams(location.search);
    const parts = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].map(k => q.get(k)).filter(Boolean);
    if (!parts.length && q.get('fbclid')) parts.push('facebook (fbclid)');
    if (!parts.length && q.get('gclid')) parts.push('google (gclid)');
    const old = JSON.parse(store.get('pp_src') || 'null');
    if (parts.length && !(old && Date.now() - old.t < 30 * 864e5)) store.set('pp_src', JSON.stringify({ s: parts.join(' / ').slice(0, 200), t: Date.now() }));
  } catch (e) { /* ignore */ }
})();

  /* eslint-enable */
  window.fbq('init', id); window.fbq('track', 'PageView');
  return (PIXEL = id);
}
async function track(ev, params) {

function lpFill(root, c) {
  if (!root.isConnected || !document.body.classList.contains('lp-on')) return;
  const plans = c.plans || [], trial = plans.find(p => p.isTrial), paid = plans.filter(p => !p.isTrial && p.active);
  const days = trial ? trial.durationDays : 14, tg = trial && trial.limits ? trial.limits.guests : null;
  $$('[data-trial-days]', root).forEach(e => { e.textContent = days; });
  $$('[data-trial-guests]', root).forEach(e => { e.textContent = tg == null ? 'unlimited' : tg; });
  const maxCol = paid.reduce((m, p) => Math.max(m, p.collaborators || 0), 0);
  const fc = $('[data-fam-count]', root);
  if (fc) { if (maxCol) fc.textContent = 'Paid plans include up to ' + maxCol + ' family members (the free trial is just you)'; else fc.remove(); }
  const valid = p => p.durationDays % 365 === 0 ? (p.durationDays / 365) + ' year' + (p.durationDays > 365 ? 's' : '') : p.durationDays + ' days';
  $('.lp-plans', root).innerHTML = (trial ? '<div class="lp-plan"><h3>' + esc(trial.name) + '</h3><div class="lp-pp">Free</div><div class="lp-pn">for ' + days + ' days · no card</div><ul class="lp-ticks">' + (trial.features || []).map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>' + lpCta('Start free', 'ghost wide', 'plan trial') + '</div>' : '') +
    paid.map(p => '<div class="lp-plan' + (p.badge ? ' hot' : '') + '">' + (p.badge ? '<span class="lp-badge">' + esc(p.badge) + '</span>' : '') + '<h3>' + esc(p.name) + '</h3><div class="lp-pp">' + inr(p.price) + '</div><div class="lp-pn">one-time · valid ' + valid(p) + (p.tagline ? ' · ' + esc(p.tagline) : '') + '</div><ul class="lp-ticks">' + (p.features || []).map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>' + lpCta('Start free, upgrade later', (p.badge ? '' : 'ghost ') + 'wide', 'plan ' + p.planId) + '</div>').join('') ||
    '<div class="lp-empty">Plans will appear here.</div>';
  if (c.offerText) {
    $('.lp-plans', root).insertAdjacentHTML('beforebegin', '<div class="lp-offer">🎉 ' + esc(c.offerText) + '</div>');
    const bar = $('.lp-offerbar', root); bar.innerHTML = '🎉 ' + esc(c.offerText) + ' · <a href="#lp-pricing">See plans</a>'; bar.hidden = false;
    $('a', bar).onclick = e => { e.preventDefault(); $('#lp-pricing', root).scrollIntoView({ behavior: 'smooth' }); };
  }

  // testimonials: only real ones ticked "Show on page" in the admin
  const t = c.testimonials || [];
  if (t.length) {
    const sec = $('.lp-tst', root); sec.hidden = false;
    $('.lp-quotes', sec).innerHTML = t.slice(0, 6).map(q => '<figure class="lp-q"><div class="lp-stars" aria-hidden="true">★★★★★</div><blockquote>“' + esc(q.quote) + '”</blockquote><figcaption><b>' + esc(q.name) + '</b>' + (q.detail ? '<small>' + esc(q.detail) + '</small>' : '') + '</figcaption></figure>').join('');
  }

  // FAQ (uses the live trial and plan settings)
  const minPaid = paid.length ? Math.min.apply(null, paid.map(p => p.price)) : null;
  const faq = [
    ['Is the trial really free?', 'Yes. ' + days + ' days, every screen unlocked' + (tg != null ? ', up to ' + tg + ' guests' : '') + '. No card needed, just your email.'],
    ['What happens when the trial ends?', 'Your planner turns read-only. Nothing is deleted: you can still open it and export it to Excel. Upgrade' + (minPaid != null ? ' (from ' + inr(minPaid) + ', one-time)' : '') + ' to keep editing.'],
    ['Is it a subscription?', 'No. You pay once and the plan is valid for the time shown on it. Nothing renews automatically.'],
    ['Can my family use it on their phones?', maxCol ? 'Yes. On a paid plan you can invite up to ' + maxCol + ' family members by email. Each one signs in on their own phone, and you choose who can edit and who can only view.' : 'Yes. On a paid plan you can invite family members by email, with edit or view-only access.'],
    ['Do I need to install an app?', 'No. It runs in the browser on any phone or laptop. On your phone you can “Add to Home screen” to open it like an app.'],
    ['Who can see my wedding details?', 'Only you and the people you invite. Your planner is saved to your account and opens only after signing in with an invited email. If you ask us for help, our support team can view it (read-only) to sort things out.'],
    ['I already have the Pandora Excel planner. Can I use it?', 'Yes. When you start, choose “Import my Pandora Excel” and your guests, budget, vendors and the rest come across. You can export back to Excel any time.'],
    ['How do I pay?', 'Inside the planner, with Razorpay: UPI, cards, netbanking and wallets. If you have a promo code, enter it there.'],
  ];
  if (c.whatsapp) faq.push(['Still have a question?', 'Message us on WhatsApp with the green button, and we’ll help.']);
  $('.lp-faq', root).innerHTML = faq.map((f, i) => '<details' + (i ? '' : ' open') + '><summary>' + esc(f[0]) + '</summary><p>' + esc(f[1]) + '</p></details>').join('');

/* ---------- phones: tidy, check, call and WhatsApp ---------- */
/** Digits to dial, with country code (91 for Indian numbers typed without one). '' if there is no number. */
function phoneDigits(p) {
  const s = String(p == null ? '' : p).trim(); if (!s) return '';
  let plus = s[0] === '+', d = s.replace(/\D/g, '');
  if (!d) return '';
  if (!plus && d.indexOf('00') === 0 && d.length > 11) { d = d.slice(2); plus = true; }
  if (!plus) { if (d.length === 11 && d[0] === '0') d = d.slice(1); if (d.length === 10) d = '91' + d; }
  return d;
}
/** false when a number is typed but can't be right (too short, too long, or an Indian number that isn't 10 digits). */
function phoneOk(p) {
  const d = phoneDigits(p); if (!d) return true;
  if (d.indexOf('91') === 0 && d.length === 12) return true;
  if (d.indexOf('91') === 0 && !/^\s*\+/.test(String(p))) return false;
  return d.length >= 8 && d.length <= 15;
}
/** "98765 43210" for Indian numbers, "+44 7700900123" style for others; anything doubtful is left as typed. */
function phoneFmt(p) {
  const raw = String(p == null ? '' : p).trim(); if (!raw || !phoneOk(raw)) return raw;
  const d = phoneDigits(raw);
  if (d.indexOf('91') === 0 && d.length === 12) return d.slice(2, 7) + ' ' + d.slice(7);
  return '+' + d;
}
const telHref = p => { const d = phoneDigits(p); return d ? 'tel:+' + d : ''; };
/** WhatsApp link. Without a number, WhatsApp opens with the message and lets you pick the chat. */
const waHref = (p, text) => { const d = phoneDigits(p); return 'https://wa.me/' + (d && phoneOk(p) ? d : '') + (text ? '?text=' + encodeURIComponent(text) : ''); };
/** Small 📞 / 💬 buttons for a number. o.wa=false hides WhatsApp; o.text pre-fills the WhatsApp message. */
function telBtns(p, o) {
  o = o || {};
  if (!phoneDigits(p)) return o.empty || '';
  if (!phoneOk(p)) return '<span class="pwarn" title="This number looks incomplete or wrong. Check it.">⚠</span>';
  return '<span class="cbt">' + (o.call === false ? '' : '<a class="ib" href="' + telHref(p) + '" title="Call ' + esc(o.name || p) + '" aria-label="Call">📞</a>') +
    (o.wa === false ? '' : '<a class="ib wa" href="' + esc(waHref(p, o.text || '')) + '" target="_blank" rel="noopener" title="WhatsApp ' + esc(o.name || p) + '" aria-label="WhatsApp">💬</a>') + '</span>';
}
const TEL = (k, label, o) => Object.assign({ k, label, t: 'tel', w: 150 }, o);

/** The phone number behind a name used anywhere in the planner: family & team, vendors, hotels, transport, guests. */
function phoneOf(name) {
  const n = String(name || '').trim().toLowerCase(); if (!n) return null;
  const hit = (rows, keys, ph, kind) => { for (const r of rows || []) for (const k of keys) if (r[k] && String(r[k]).trim().toLowerCase() === n && phoneDigits(r[ph])) return { phone: r[ph], name: r[k], kind, row: r }; return null; };
  const sel = (S.vendors || []).filter(v => v.decision === 'Selected');
  return hit(S.people, ['name'], 'phone', 'person') || hit(sel, ['vendor', 'contact', 'line'], 'phone', 'vendor') || hit(S.vendors, ['vendor', 'contact'], 'phone', 'vendor') ||
    hit(S.hotels, ['hotel', 'contact'], 'phone', 'hotel') || hit(S.vehicles, ['operator', 'contact'], 'phone', 'vehicle') || hit(S.guests, ['name'], 'phone', 'guest') || roughVendor(n, sel);
}
// "Photographer" in the run sheet finds the booked "Photography" vendor: a shared word start of 5+ letters.
function roughVendor(n, sel) {
  const stems = s => String(s || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 5).map(w => w.slice(0, 5));
  const want = stems(n); if (!want.length) return null;
  const v = sel.find(x => phoneDigits(x.phone) && stems(x.line + ' ' + x.vendor).some(w => want.indexOf(w) >= 0));
  return v ? { phone: v.phone, name: v.vendor, kind: 'vendor', row: v } : null;
}
const whoBtns = (name, o) => { const h = phoneOf(name); return h ? telBtns(h.phone, Object.assign({ name: h.name }, o || {})) : ''; };

/* ---------- undo ---------- */
const UNDO = [];
/** Remember a row as it was before a change. */
function undoRow(coll, before, label) { if (RO() || !before) return; UNDO.push({ coll, id: before.id, row: copy(before), label: label || 'Edited ' + (rowName(before) || 'a row') }); if (UNDO.length > 40) UNDO.shift(); undoBtn(); }
function undoDel(coll, row, idx) { if (RO()) return null; const e = { coll, id: row.id, row: copy(row), idx, del: true, label: 'Deleted ' + (rowName(row) || 'a row') }; UNDO.push(e); if (UNDO.length > 40) UNDO.shift(); undoBtn(); return e; }
function undo(entry) {
  if (RO()) return;
  const i = entry ? UNDO.indexOf(entry) : UNDO.length - 1; if (i < 0) return;
  const e = UNDO.splice(i, 1)[0], rows = S[e.coll] || []; if (!e.fn && !S[e.coll]) return;
  const at = rows.findIndex(r => r.id === e.id);

const nowHM = () => { const t = new Date(); return String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); };
const hm12 = t => { const m = /^(\d\d?):(\d\d)/.exec(t || ''); if (!m) return t || ''; const h = +m[1]; return (h % 12 || 12) + ':' + m[2] + (h < 12 ? ' am' : ' pm'); };
/** The function to show: today's (the one that has started most recently), else the next one, else the last one. */
function dayFn() {
  const fns = S.functions.filter(f => f.name && f.active !== 'No').slice().sort((a, b) => ((a.date || '9') + (a.time || '')) < ((b.date || '9') + (b.time || '')) ? -1 : 1);
  if (UI.dayFn && fns.some(f => f.name === UI.dayFn)) return { fns, cur: fns.find(f => f.name === UI.dayFn) };
  const t = fd(today()), now = nowHM(), todays = fns.filter(f => f.date === t);

}

/* ===== invite.js ===== */
/* ---------- Wedding invite: the invite maker (/shaadi) connected to this planner ----------
 * The planner is the master guest list: each family gets its own invite link showing only its functions,
 * the WhatsApp invite button sends that link, and RSVPs and blessings come back into the guest rows.
 */
var INV = { linked: false, loaded: false }; // var: read by core.js helpers before this file runs
let INV_AT = 0, INV_BUSY = null;
const invCloud = () => CLOUD.on && CLOUD.id && CLOUD.meta && CLOUD.meta.role !== 'support';
const invCanEdit = () => invCloud() && (CLOUD.meta.role === 'owner' || CLOUD.meta.role === 'editor');

function invLoad(force) {
  if (!invCloud()) return Promise.resolve(INV);
  if (!force && Date.now() - INV_AT < 30000) return Promise.resolve(INV);
  if (INV_BUSY) return INV_BUSY;
  INV_BUSY = api('/planners/' + CLOUD.id + '/invite').then(r => {
    const was = JSON.stringify(INV); INV = Object.assign({ loaded: true }, r); INV_AT = Date.now();
    if (JSON.stringify(INV) !== was && (route === 'dash' || route === 'guests')) requestRender();
    return INV;
  }).catch(() => INV).finally(() => { INV_BUSY = null; });
  return INV_BUSY;
}
function invSet(r) { INV = Object.assign({ loaded: true }, r); INV_AT = Date.now(); delete INV.editUrl; requestRender(); }

/** The link a guest's WhatsApp invite carries: their family's personal link (Premium), or the invite's one link. */
function invLink(g) {
  if (!INV.linked || !INV.live) return '';
  return (INV.links && INV.links[gk(g)]) || INV.url || '';
}
const _invGuestVals = guestVals;
guestVals = function (g) { return Object.assign(_invGuestVals(g), { link: invLink(g) }); };

/** Families' replies (kept on the family's first guest by the server). */
function invReplies() {
  const out = [];
  d().groups.forEach((members, k) => { const h = members.find(m => m.ir); if (h) out.push({ k, g: h, ir: h.ir, members }); });
  return out.sort((a, b) => String(b.ir.at || '') < String(a.ir.at || '') ? -1 : 1);
}

/* opening the editor (a tab opened straight away, so pop-up blockers allow it) */
async function invOpen(op) {
  if (!invCanEdit()) { toast('Only the owner or family members who can edit can open the invite editor.'); return; }
  const w = window.open('', '_blank');
  try {
    if (w) w.document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">Opening your invite…</p>';
    const r = await api('/planners/' + CLOUD.id + '/invite', { method: 'POST', body: { op: op || 'open' } });
    if (w) w.location.href = r.editUrl; else location.href = r.editUrl;
    invSet(r); track('InviteOpen');
  } catch (e) { if (w) w.close(); toast(e.message); }
}

function startTour() {

VIEWS.shopping = function () {
  const kp = el('<div class="grid g4" style="margin-bottom:12px"></div>'), sm = el('<div class="card" style="margin-top:14px"></div>');
  const upd = () => {
    const pl = S.shagun ? S.shopping.reduce((a, x) => a + num(x.planned), 0) : 0, ac = S.shopping.reduce((a, x) => a + num(x.actual), 0), bought = S.shopping.filter(x => ['Bought', 'Packed', 'Delivered', 'In alteration'].indexOf(x.status) >= 0).length;
    kp.innerHTML = kpi('Items', S.shopping.length, bought + ' bought / in hand') + kpi('Planned', short(pl), 'total plan', 'm') + kpi('Actual spend', short(ac), 'so far', 't') + kpi('Under / (over)', short(S.shopping.filter(x => num(x.actual)).reduce((a, x) => a + num(x.planned) - num(x.actual), 0)), 'on items bought', 'c');
    const types = L('Shopping Type').map(t => ({ t, n: S.shopping.filter(x => x.type === t).length, p: S.shopping.filter(x => x.type === t).reduce((a, x) => a + num(x.planned), 0), a: S.shopping.filter(x => x.type === t).reduce((a, x) => a + num(x.actual), 0) })).filter(x => x.n);
    const mx = Math.max.apply(null, types.map(x => Math.max(x.p, x.a)).concat([1]));
    sm.innerHTML = '<h3>Summary by type</h3>' + (types.length ? types.map(x => hbar(x.t + ' (' + x.n + ')', [{ v: x.p, c: '#EADFC9' }, { v: x.a, c: '#1F7A74', top: 1 }], mx, short(x.a) + ' / ' + short(x.p))).join('') : '<div class="empty">Add outfits, jewellery and gifts to see a summary.</div>');
  };
  const g = grid({ coll: 'shopping', after: upd, empty: 'No items yet. Add outfits, jewellery, gifts and trousseau.', blank: () => ({ item: '', type: 'Outfit', status: 'To buy', qty: 1 }),
    cols: [T('item', 'Item', { w: 220 }), SEL('type', 'Type', () => L('Shopping Type'), { w: 110 }), SEL('who', 'For whom', TEAM, { w: 150 }), SEL('fn', 'Function', FNS, { w: 130 }), NUM('planned', 'Planned (₹)', { w: 100 }), NUM('actual', 'Actual (₹)', { w: 100 }), NUM('qty', 'Qty', { w: 60 }), SEL('status', 'Status', () => L('Shopping Status'), { w: 120 }), T('shop', 'Shop / source', { w: 140 }), T('box', 'Trunk / box #', { w: 90 }), T('notes', 'Notes', { w: 140 }),
      CALC('ud', 'Under / (over)', r => num(r.actual) ? num(r.planned) - num(r.actual) : '', { fmt: v => v === '' ? '' : '<span style="color:' + (v < 0 ? '#E0675A' : 'inherit') + '">' + inr(v) + '</span>', num: 1 })] });
  const add = el('<button class="btn pri">+ Add item</button>'); add.onclick = () => g.add();
  const head = el('<div>' + ph('Shopping, Outfits & Gifts', 'One row per item: outfits, jewellery, family gifts, trousseau, return gifts and puja items.') + '</div>'); head.querySelector('.page-h').appendChild(add);
  upd(); return [head.firstChild, kp, g.root, sm];
};

/* ---------- Family handout (print) ---------- */

    '<h3>Functions</h3><table><tr><th>Function</th><th>Date</th><th>Time</th><th>Venue</th><th>Dress code / theme</th></tr>' + (fns.map(f => '<tr><td><b>' + esc(f.name) + '</b></td><td>' + esc(dshow(f.date)) + '</td><td>' + esc(f.time || '') + '</td><td>' + esc(f.venue || '') + '</td><td>' + esc(f.dress || '') + '</td></tr>').join('') || '<tr><td colspan="5">Add functions in the Functions page.</td></tr>') + '</table>' +
    (hotels.length ? '<h3>Where to stay</h3><table><tr><th>Hotel</th><th>Room types</th></tr>' + hotels.map(h => '<tr><td><b>' + esc(h) + '</b></td><td>' + esc(S.hotels.filter(x => x.hotel === h).map(x => x.type).join(', ')) + '</td></tr>').join('') + '</table>' : '') +
    (sel.length ? '<h3>Key contacts</h3><table><tr><th>Role</th><th>Vendor</th><th>Contact</th><th>Phone</th></tr>' + sel.map(v => '<tr><td>' + esc(v.line) + '</td><td><b>' + esc(v.vendor) + '</b></td><td>' + esc(v.contact || '') + '</td><td>' + (phoneDigits(v.phone) ? '<a href="' + telHref(v.phone) + '">' + esc(v.phone) + '</a>' : esc(v.phone || '')) + '</td></tr>').join('') + '</table>' : '') +
    ((S.people || []).some(p => p.star === 'Yes' && phoneDigits(p.phone)) ? '<h3>Family contacts</h3><table><tr><th>Name</th><th>Role</th><th>Phone</th></tr>' + S.people.filter(p => p.star === 'Yes' && phoneDigits(p.phone)).map(p => '<tr><td><b>' + esc(p.name) + '</b></td><td>' + esc(p.role || '') + '</td><td><a href="' + telHref(p.phone) + '">' + esc(p.phone) + '</a></td></tr>').join('') + '</table>' : '') +
    '<div class="note" style="text-align:center;margin-top:20px">Planned with Pandora Templates · pandoratemplates.com</div></div>');
  const btn = el('<button class="btn pri">🖨️ Print / Save as PDF</button>'); btn.onclick = () => window.print();
  const head = el('<div>' + ph('Family Handout', 'A clean one-page summary to print or save as PDF and share with family: functions, stay, booked vendors and your ⭐ starred family contacts.') + '</div>'); head.querySelector('.page-h').appendChild(btn);
  return [head.firstChild, sheet];
};

/* ---------- Setup & data ---------- */
function replaced(note) { undoClear(); if (CLOUD.on) { CLOUD.forceReplace = true; CLOUD.replaceNote = note; } dirty(); save(); }
VIEWS.setup = function () {
  const s = S.settings;
  const box = el('<div class="grid g2"></div>');
  const couple = el('<div class="card"><h3>Your wedding</h3><div class="grid g2" style="gap:10px">' +
    ['bride|Bride’s name|text', 'groom|Groom’s name|text', 'date|Wedding date|date', 'city|Wedding city|text', 'start|Planning start date|date'].map(x => { const p = x.split('|'); return '<label class="field">' + p[1] + '<input class="inp" type="' + p[2] + '" data-s="' + p[0] + '" value="' + esc(s[p[0]] || '') + '"></label>'; }).join('') +
    '</div><div class="note" style="margin-top:10px">The planning start date is the day you began. Task deadlines are spread between that day and the wedding.</div></div>');
  couple.addEventListener('change', e => { const k = e.target.dataset.s; if (!k) return; S.settings[k] = e.target.value; if (S.demo) { /* keep demo flag until user chooses */ } dirty(); badges(); });
  const team = el('<div class="card"><h3>Family & team</h3><p class="note" style="margin-top:0">Names, roles and phone numbers of the family and helpers. These names appear in the “Assigned to” dropdowns.</p><p><b>' + (S.people || []).filter(p => p.name).length + '</b> people: ' + esc(TEAM().slice(0, 6).join(', ')) + (TEAM().length > 6 ? '…' : '') + '</p><button class="btn pri" data-team>Edit in Contacts</button></div>');
  team.querySelector('[data-team]').onclick = () => { if (!on('contacts')) { S.features = Object.assign({}, S.features, { contacts: true }); dirty(); } UI.tab.ct = 'team'; go('contacts'); };
  box.appendChild(couple); box.appendChild(team);
  const kinds = MSG_KINDS.filter(k => k[0] === 'invite' || on('templates'));
  if (!kinds.some(k => k[0] === UI.tab.msg)) UI.tab.msg = 'invite';
  const msg = el('<div class="card" style="margin-top:14px"><h3>WhatsApp ' + (kinds.length > 1 ? 'messages' : 'invitation message') + '</h3>' + (kinds.length > 1 ? '<div class="tabs" data-mk>' + kinds.map(k => '<button data-k="' + k[0] + '">' + esc(k[1]) + '</button>').join('') + '</div>' : '') + '<p class="note" style="margin-top:0" data-mh></p><textarea class="inp" id="msgbox" style="min-height:150px;width:100%"></textarea><div class="bar" style="margin-top:8px"><button class="btn sm ghost" data-reset>Reset to our wording</button><span class="note">A line whose placeholders are all empty is left out of the message.</span></div></div>');
  const mt = $('#msgbox', msg);
  const mshow = () => { const k = UI.tab.msg, kd = MSG_KINDS.find(x => x[0] === k); mt.value = msgText(k); $('[data-mh]', msg).innerHTML = 'Used on: ' + esc(kd[2]) + ' Placeholders: ' + MSG_HELP[k].split(' ').map(p => '<code>' + p + '</code>').join(' '); $$('[data-mk] button', msg).forEach(b => b.classList.toggle('on', b.dataset.k === k)); };
  const mk = $('[data-mk]', msg); if (mk) mk.onclick = e => { const b = e.target.closest('[data-k]'); if (b) { UI.tab.msg = b.dataset.k; mshow(); } };
  mt.onchange = () => { const k = UI.tab.msg; if (k === 'invite') S.msg = mt.value; else S.msgs = Object.assign({}, S.msgs, { [k]: mt.value }); dirty(); toast('Message saved'); };
  $('[data-reset]', msg).onclick = () => { const k = UI.tab.msg; if (k === 'invite') S.msg = defaultMsg(); else S.msgs = Object.assign({}, S.msgs, { [k]: defaultMsgs()[k] }); dirty(); mshow(); toast('Back to our wording'); };
  mshow();
  const data = el('<div class="card" style="margin-top:14px"><h3>Your data</h3><p class="note" style="margin-top:0">Everything is saved automatically in this browser. Export a copy now and then to keep it safe, or to move to another device.</p><div class="bar">' +
    '<button class="btn dark" data-x="xlsx">⬇ Export to Excel</button><button class="btn" data-x="json">⬇ Backup (JSON)</button><label class="btn pri" style="cursor:pointer">⬆ Import Excel or backup<input type="file" id="imp" accept=".xlsx,.xls,.json" style="display:none"></label></div>' +
    '<div class="note">Import reads the <b>Pandora Indian Wedding Planner v0.3</b> Excel (your Guests, Vendors, Payments, Tasks and all other input sheets), or a backup file from here.</div>' +
    '<hr style="border:0;border-top:1px dashed #EADFC9;margin:14px 0"><div class="bar"><button class="btn" data-x="fresh">Start a fresh plan</button><button class="btn ghost" data-x="demo">Reload sample data</button></div></div>');
  data.addEventListener('click', async e => {
    const x = e.target.dataset.x; if (!x) return;
    if (x === 'xlsx') { try { await exportWorkbook(); } catch (err) { toast('Export failed: ' + err.message); } }
    else if (x === 'json') exportJSON();
    else if (x === 'fresh') { if (await ask('Start a fresh plan?', 'This clears the guests, vendors, payments and everything else' + (CLOUD.on ? ' for everyone on this planner (a restore point is saved in Activity)' : '') + '. The task timeline, budget categories and ritual checklist stay as your starting template.', 'Start fresh')) { S = freshState(); replaced('Started a fresh plan'); toast('Fresh plan ready. Add your wedding details.'); renderAll(); } }
    else if (x === 'demo') { if (await ask('Reload the sample data?', 'This replaces your current plan with the Ananya & Arjun sample' + (CLOUD.on ? ' for everyone on this planner (a restore point is saved in Activity)' : '. Export a backup first if you want to keep your work') + '.', 'Replace with sample')) { S = demoState(); if (CLOUD.on) S.demo = false; replaced('Loaded the sample data'); renderAll(); } }
  });
  data.querySelector('#imp').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      let next;
      if (/\.json$/i.test(file.name)) next = normalize(JSON.parse(await file.text()));
      else next = await importWorkbook(await file.arrayBuffer());
      if (await ask('Import “' + file.name + '”?', 'This replaces what is in the planner now with the file’s data: ' + next.guests.length + ' guests, ' + next.vendors.length + ' vendor quotes, ' + next.payments.length + ' payments, ' + next.tasks.length + ' tasks.', 'Import')) { S = next; S.demo = false; replaced('Imported “' + file.name + '”'); toast('Imported ✔'); renderAll(); }
    } catch (err) { toast('Could not read that file: ' + err.message); }
    e.target.value = '';
  };
  const tips = el('<div class="card" style="margin-top:14px"><h3>Quick start <button class="btn sm keep" data-tour style="float:right">▶ Take the tour</button></h3><ol style="margin:0;padding-left:20px;line-height:1.9"><li>Enter your names, wedding date and city above.</li><li>Open <b>Budget → Planner</b> and type your total budget.</li><li>Add your <b>Guests</b>, tap Y under each function they are invited to, and send invites on WhatsApp.</li><li>Add <b>Hotels</b> and <b>Vehicles</b>; allocate families as they say they are coming.</li><li>Log vendor quotes in <b>Vendors</b>, select your pick, and add its payment schedule in <b>Payments</b>.</li><li>Check the <b>Dashboard</b> every few days. It tells you what needs attention.</li></ol></div>');
  const lists = el('<div class="card" style="margin-top:14px"><h3>Dropdown options</h3><p class="note" style="margin-top:0">Change the choices in any dropdown, e.g. add “Gujarati Thali” to Diet. One option per line.</p><div class="row2" style="align-items:flex-start"><select class="sel" data-ln>' + Object.keys(S.lists).filter(k => k !== 'Selected Vendors (auto)').map(k => '<option>' + esc(k) + '</option>').join('') + '</select><textarea class="inp" data-lv style="flex:1;min-width:220px;min-height:150px"></textarea></div></div>');
  const ln = $('[data-ln]', lists), lv = $('[data-lv]', lists);
  ln.setAttribute('data-free', ''); const fill = () => { lv.value = (S.lists[ln.value] || []).join('\n'); }; fill();
  ln.onchange = fill;
  lv.onchange = () => { const v = lv.value.split('\n').map(x => x.trim()).filter(Boolean); if (!v.length) { toast('Keep at least one option'); fill(); return; } S.lists = Object.assign({}, S.lists, { [ln.value]: v }); dirty(); toast('Options saved'); };
  const head = el('<div>' + ph('Setup & Data', 'Your wedding details, family list, WhatsApp messages, dropdown options and your data.') + '</div>').firstChild;
  if (CLOUD.on) $('.note', data).innerHTML = 'Everything is saved to your account automatically and syncs to every device you sign in on. Export a copy to keep offline, or to use in Excel.';
  return [head, box, msg, lists, data, tips];
};

/* ---------- boot ---------- */
function boot() {
  S = load();
  $('#nav').addEventListener('click', e => { const a = e.target.closest('a[data-r]'); if (a) go(a.dataset.r); });
  document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(g.dataset.go); });
  $('#burger').onclick = () => $('.side').classList.toggle('open');
  window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (VIEWS[r] && r !== route) { route = r; renderAll(); } });
  const h = location.hash.slice(1); if (VIEWS[h]) route = h;
  window.addEventListener('beforeunload', e => { save(); if (CLOUD.on && (CLOUD.pushT || CLOUD.inflight) && CLOUD.status !== 'saved') { e.preventDefault(); e.returnValue = ''; } });
  cloudBoot();
  registerSW();
}
// Small handle for support and automated tests (browser console: PP.state()).
window.PP = { state: () => S, dirty, renderAll, uid, api, upgradeModal, cloud: CLOUD };
boot();

});
