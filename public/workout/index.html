<style>/* Colours: a light and a dark base (data-mode), each with 4 accent themes (data-theme). Light is the default. */
:root{--bg:#F4F6FB;--bg2:#FFFFFF;--card:#FFFFFF;--card2:#F1F4FA;--line:#E2E7F1;--tx:#141B2D;--mu:#5F6B85;--ac:#FF5A36;--ac2:#FF8A3D;--gold:#D99100;--ok:#4E9A06;--okx:#fff;--blue:#3B6FE0;--pink:#E5488F;--bad:#E5384B;--ring:rgba(255,90,54,.16);--sh:0 8px 24px rgba(20,27,45,.07);--r:20px;--fh:'Sora',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;--safe:env(safe-area-inset-bottom,0px);color-scheme:light}
[data-mode=dark]{--bg:#0B1020;--bg2:#10172A;--card:#151D33;--card2:#1C2642;--line:#26304D;--tx:#EEF2FA;--mu:#8D98B3;--gold:#FFC53D;--ok:#B8F23A;--okx:#122000;--blue:#5B8CFF;--pink:#FF6FB5;--bad:#FF5D6C;--ring:rgba(255,90,54,.18);--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
[data-theme=ocean]{--ac:#0891B2;--ac2:#0EA5E9;--ring:rgba(8,145,178,.16)}[data-mode=dark][data-theme=ocean]{--bg:#06141B;--bg2:#0A1E27;--card:#0E2733;--card2:#123241;--line:#1A4152;--ac:#22D3EE;--ac2:#38BDF8;--ring:rgba(34,211,238,.18)}
[data-theme=gold]{--ac:#C98A00;--ac2:#E0A100;--ring:rgba(201,138,0,.16)}[data-mode=dark][data-theme=gold]{--bg:#120E05;--bg2:#1A1508;--card:#231C0B;--card2:#2E250F;--line:#3E3216;--ac:#FFC53D;--ac2:#F59E0B;--ring:rgba(255,197,61,.2)}
[data-theme=rose]{--ac:#DB2777;--ac2:#EC4899;--ring:rgba(219,39,119,.14)}[data-mode=dark][data-theme=rose]{--bg:#150A12;--bg2:#1E0E1A;--card:#271324;--card2:#331A2F;--line:#45233F;--ac:#FF6FB5;--ac2:#F472B6;--ring:rgba(255,111,181,.2)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--fh);margin:0 0 .4em;letter-spacing:-.01em;line-height:1.15}h2{font-size:22px}h3{font-size:17px}
a{color:var(--ac)}button{font:inherit;color:inherit}input,select,textarea{font:inherit;color:var(--tx);background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--ring)}
.boot-out #app{display:none}.boot-app #lp{display:none}
.muted{color:var(--mu)}.tiny{font-size:12px}.sm{font-size:13px}.c{text-align:center}.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.sp{flex:1}.mt{margin-top:14px}.mb{margin-bottom:14px}.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .12s,filter .2s;white-space:nowrap}
[data-mode=dark][data-theme=gold] .btn{color:#1A1200}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:default}
.btn.big{width:100%;padding:15px 22px;font-size:16px}.btn.sm{padding:8px 14px;font-size:13px}.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}.btn.ok{background:var(--ok);color:var(--okx)}.btn.dark{background:var(--tx);color:var(--bg)}
.link{background:none;border:0;color:var(--ac);cursor:pointer;padding:6px 0;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}.pill.ok{color:var(--ok)}.pill.hot{color:var(--ac);border-color:var(--ac)}.pill.gold{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}.card h3{display:flex;align-items:center;gap:8px}.card h3 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* layout */
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.avatar i{position:absolute;bottom:-4px;right:-6px;background:var(--bg);border:2px solid var(--ac);color:var(--tx);border-radius:999px;font:700 10px var(--fb);padding:0 5px;font-style:normal}
.hello{line-height:1.15}.hello small{display:block;color:var(--mu);font-size:12px}.hello b{font-family:var(--fh);font-size:16px}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);text-decoration:none;font-size:17px}
.iconbtn i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font:700 11px/18px var(--fb);text-align:center;font-style:normal;padding:0 4px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}.sync span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:11px}.sync em{display:none;font-style:normal}
.sync.offline span{color:var(--gold)}.sync.error span{color:var(--bad)}.sync.saving span{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#main{padding:6px 16px calc(96px + var(--safe));max-width:760px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 8px calc(8px + var(--safe));background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mu);font-size:11px;font-weight:600;padding:4px 10px;border-radius:14px;min-width:58px}
.nav a span{font-size:21px;filter:grayscale(1) opacity(.7);transition:transform .2s}.nav a em{font-style:normal}
.nav a.on{color:var(--tx)}.nav a.on span{filter:none;transform:translateY(-2px) scale(1.1)}
.nav .dot{position:absolute;top:2px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--bg2)}
.nav-brand,.desk{display:none!important}
@media (min-width:900px){
  .nav{top:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;padding:22px 14px;border-top:0;border-right:1px solid var(--line)}
  .nav a{flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;min-width:0}.nav a.on{background:var(--card)}.nav .dot{right:auto;left:30px}
  .nav-brand{display:flex!important;align-items:center;gap:10px;padding:0 8px 18px;font-family:var(--fh)}.nav-brand small{font-size:10px;letter-spacing:.2em;color:var(--mu)}
  .desk{display:flex!important}.nav-foot{margin-top:auto}
  .top,#main{margin-left:220px}.top{padding-left:32px;padding-right:32px}#main{padding:10px 32px 48px}.sync em{display:inline}
}
.g-logo svg{display:block}
/* tabs & segmented */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--mu)}.tabs button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--mu)}.seg button.on{background:var(--card2);color:var(--tx)}
/* hero card */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--ac) 35%,transparent),transparent 55%),linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:14px}
.hero .prog{display:flex;align-items:center;gap:16px}
.ring{--p:0;--c:var(--ac);width:86px;height:86px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1}.ring b{font:800 22px var(--fh)}.ring small{font-size:10px;color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.flame{display:inline-flex;align-items:center;gap:4px;font:800 15px var(--fh)}.flame .f{font-size:20px;filter:drop-shadow(0 0 8px rgba(255,120,40,.6))}.flame.cold .f{filter:grayscale(1);opacity:.5}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}.flame.hot .f{animation:flick 1.2s ease-in-out infinite}
.xpbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.xpbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--ac));transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}

.wo{display:flex;gap:14px;align-items:center}.wo .fig{width:86px;height:86px;flex:none;background:var(--bg2);border-radius:18px}
.wo h3{margin:0 0 4px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:13px}
.exs{display:flex;gap:8px;overflow-x:auto;margin:14px -4px 4px;padding:0 4px 4px;scrollbar-width:none}.exs::-webkit-scrollbar{display:none}
.ex{flex:none;width:92px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center;font-size:11.5px;line-height:1.2;cursor:pointer}.ex .fig{width:64px;height:64px}.ex b{display:block;font-weight:600}.ex small{color:var(--mu)}
.fig .fg-floor{stroke:var(--line);stroke-width:1.4}.fig .fg-prop{fill:var(--card2);stroke:var(--mu);stroke-width:1}.fig .fg-propl{fill:none;stroke:var(--mu);stroke-width:2.4;stroke-linecap:round}
.fig .fg-t,.fig .fg-f path,.fig .fg-b path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5.2}.fig .fg-t,.fig .fg-f path{stroke:var(--ac)}.fig .fg-b path{stroke:color-mix(in srgb,var(--ac) 50%,var(--card))}.fig .fg-h{fill:var(--ac)}
/* checkpoints */
.cps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cp{position:relative;background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:10px 4px 8px;text-align:center;cursor:pointer;user-select:none;transition:border-color .2s,transform .12s}
.cp:active{transform:scale(.96)}.cp .e{font-size:22px;display:block}.cp b{display:block;font:700 14px var(--fh);margin-top:2px}.cp small{display:block;color:var(--mu);font-size:10.5px}
.cp.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg2))}.cp.done::after{content:'✓';position:absolute;top:-7px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:var(--okx);font:800 12px/20px var(--fb)}
.cp-need{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--mu)}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0}.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:24px;cursor:pointer}.stepper b{font:800 40px var(--fh);min-width:90px;text-align:center}

.q{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.q:first-of-type{border-top:0}
.q .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}.q.done .ck{background:var(--ok);border-color:var(--ok);color:var(--okx)}.q.done span{color:var(--mu);text-decoration:line-through}
.q em{margin-left:auto;font-style:normal;color:var(--gold);font-weight:700;font-size:12.5px}

.chest .e{font-size:34px}.chest.ready .e{animation:wob 1s ease-in-out infinite}@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.1)}}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.week div{font-size:11px;color:var(--mu)}

label.f{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:12px 0 6px}

function fmtDur(sec) { sec = Math.round(sec); if (sec < 60) return sec + 's'; const m = Math.floor(sec / 60), x = sec % 60; return x ? m + ':' + String(x).padStart(2, '0') : m + ' min'; }

/** Retest days: day 1, a third and two-thirds of the way, and the last day. */
const testDays = (n) => [...new Set([1, Math.round(n / 3), Math.round((2 * n) / 3), n])];

/**
 * The plan for day `n` (1-based) of a challenge: phase, whether it's a rest day, a test day, and the session.
 * `ch` = { program, length, start, adj } where adj (0.7–1.4) scales reps and times (easier/harder feedback, comeback mode).
 */
function planDay(ch, n, extraScale) {
  const prog = PROGRAMS[ch.program] || PROGRAMS.home;
  const len = ch.length || 30;
  const ph = Math.min(3, Math.floor((4 * (n - 1)) / len));
  const k = Math.max(0.6, Math.min(1.5, (ch.adj || 1) * (extraScale || 1)));
  const slot = prog.week[(n - 1) % prog.week.length];
  const test = testDays(len).includes(n);
  let sess;
  if (slot === 'M') sess = MOBILITY;
  else if (ch.program === 'c25k') {
    if (slot === 'R') {
      const runDays = []; for (let i = 1; i <= len; i++) if (prog.week[(i - 1) % prog.week.length] === 'R') runDays.push(i);
      sess = runSession(runDays.length > 1 ? runDays.indexOf(n) / (runDays.length - 1) : 0, k);
    } else if (slot === 'W') sess = walkSession('W', Math.min(ph, 1), k);
    else sess = { title: 'Rest day', kind: 'rest', blocks: [{ label: 'Gentle stretch', rounds: 1, rest: 5, items: [s('quad', 40), s('hamstring', 40), s('calf', 30), s('breathe', 60)] }] };
  } else sess = prog.make(slot, ph, k);
  const restDay = sess.kind === 'rest';
  return { n, phase: ph, phaseName: PHASES[ph], rest: restDay, test, session: sess, mins: estMinutes(sess) };
}

function estMinutes(sess) {
  let sec = 0;
  sess.blocks.forEach((b) => { for (let i = 0; i < b.rounds; i++) b.items.forEach((it) => { sec += it.secs || (it.reps || 10) * ((EX[it.ex] && EX[it.ex].t) || 2000) / 1000 + 5; sec += sess.restSec || b.rest || 0; }); });
  return Math.max(5, Math.round(sec / 60));
}

/** Flattens a session into the player's steps: exercise, rest, exercise… */
function playerSteps(sess) {
  const out = [];
  sess.blocks.forEach((b, bi) => {
    for (let rd = 0; rd < b.rounds; rd++) {
      b.items.forEach((it, ii) => {
        out.push({ ex: it.ex, reps: it.reps || 0, secs: it.secs || 0, fast: it.fast, label: b.label + (b.rounds > 1 ? ` · round ${rd + 1}/${b.rounds}` : ''), block: bi });
        const last = ii === b.items.length - 1;
        const restSec = last ? (rd < b.rounds - 1 ? b.rest : 0) : sess.kind === 'intervals' ? sess.restSec : sess.kind === 'cardio' ? 0 : Math.min(20, b.rest || 15);
        if (restSec > 0) out.push({ rest: restSec, label: last ? 'Rest between rounds' : 'Rest' });
      });
    }
  });
  return out;
}

function parsePose(str, mirrorOf) {
  if (str === 'M') { const a = parsePose(mirrorOf); return { pts: a.pts.map(([x, y]) => [100 - x, y]), bend: a.bend }; }
  const [p, b] = str.split('|');
  return { pts: p.trim().split(/\s+/).map((xy) => xy.split(',').map(Number)), bend: Number(b) || 0 };
}
const POSE_CACHE = {};
function posesOf(id) {
  if (POSE_CACHE[id]) return POSE_CACHE[id];
  const e = EX[id] || EX.march;
  const a = parsePose(e.p[0]);
  const b = parsePose(e.p[1] || e.p[0], e.p[0]);
  return (POSE_CACHE[id] = [a, b]);
}
const PROPS = {
  wall: '<rect x="82" y="8" width="5" height="84" rx="1.5" class="fg-prop"/>',
  wallL: '<rect x="25" y="8" width="5" height="84" rx="1.5" class="fg-prop"/>',

};
function figureSvg(id) {
  const e = EX[id] || EX.march;
  return `<svg class="fig" viewBox="0 0 100 100" data-ex="${id}" aria-hidden="true"><line x1="4" y1="92.5" x2="96" y2="92.5" class="fg-floor"/>${PROPS[e.prop] || ''}<g class="fg-b"><path class="b1"/><path class="b2"/></g><path class="fg-t"/><g class="fg-f"><path class="f1"/><path class="f2"/></g><circle class="fg-h" r="6.2"/></svg>`;
}
function drawPose(svg, a, b, t) {
  const P = (i) => [a.pts[i][0] + (b.pts[i][0] - a.pts[i][0]) * t, a.pts[i][1] + (b.pts[i][1] - a.pts[i][1]) * t];
  const j = Array.from({ length: 11 }, (_, i) => P(i)), bend = a.bend + (b.bend - a.bend) * t;
  const L = (...ps) => 'M' + ps.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
  const [H, N, Hp, K1, F1, K2, F2, E1, A1, E2, A2] = j;
  const mx = (N[0] + Hp[0]) / 2, my = (N[1] + Hp[1]) / 2 + bend;
  svg.querySelector('.fg-t').setAttribute('d', `M${N[0].toFixed(1)} ${N[1].toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${Hp[0].toFixed(1)} ${Hp[1].toFixed(1)}`);
  svg.querySelector('.b1').setAttribute('d', L(Hp, K2, F2));
  svg.querySelector('.b2').setAttribute('d', L(N, E2, A2));
  svg.querySelector('.f1').setAttribute('d', L(Hp, K1, F1));
  svg.querySelector('.f2').setAttribute('d', L(N, E1, A1));
  const h = svg.querySelector('.fg-h'); h.setAttribute('cx', H[0].toFixed(1)); h.setAttribute('cy', H[1].toFixed(1));
}
/** Animates every figure on the page (cheap: one loop, paused when the tab is hidden). */
const FIG = { raf: 0, start: 0 };
function animateFigures() {
  cancelAnimationFrame(FIG.raf);
  const tick = (now) => {
    if (!FIG.start) FIG.start = now;
    document.querySelectorAll('svg.fig').forEach((svg) => {
      const id = svg.dataset.ex, e = EX[id] || EX.march, [a, b] = posesOf(id);
      const period = (svg.dataset.speed ? Number(svg.dataset.speed) : 1) * (e.t || 2000);
      const ph = ((now - FIG.start) % period) / period;
      const t = (1 - Math.cos(ph * Math.PI * 2)) / 2; // ease in and out, A → B → A
      drawPose(svg, a, b, e.hold ? t * 0.5 : t);
    });
    FIG.raf = document.querySelector('svg.fig') ? requestAnimationFrame(tick) : 0;
  };
  FIG.raf = requestAnimationFrame(tick);
}

/* ----- the device copy ----- */
const cacheKey = () => 'wk_cache_' + CLOUD.email;
function saveCache() { if (!CLOUD.email) return; try { store.set(cacheKey(), JSON.stringify({ rev: CLOUD.rev, base: CLOUD.base, state: S, me: ME })); } catch (e) { /* storage full */ } }

/* ----- changes → server ----- */
function diffOps(base, cur) {
  if (!base) return [{ replace: strip(cur) }];
  const ops = [];
  COLLS.forEach((c) => {
    const b = new Map((base[c] || []).map((r) => [r.id, JSON.stringify(r)])), seen = new Set();
    (cur[c] || []).forEach((r) => { seen.add(r.id); const j = JSON.stringify(r); if (b.get(r.id) !== j) ops.push({ c, id: r.id, r: JSON.parse(j) }); });
    b.forEach((_, id) => { if (!seen.has(id)) ops.push({ c, id, r: null }); });
  });
  TOPS.forEach((k) => { if (JSON.stringify(base[k]) !== JSON.stringify(cur[k])) ops.push({ k, v: cur[k] === undefined ? null : copy(cur[k]) }); });
  return ops;
}
function applyOpsJs(state, ops) {
  let s = Object.assign({}, state);
  ops.forEach((op) => {
    if (op.replace) { s = copy(op.replace); return; }
    if (op.k) { s[op.k] = op.v; return; }
    const rows = (s[op.c] || []).slice(), i = rows.findIndex((r) => r.id === op.id);
    if (op.r === null) { if (i >= 0) rows.splice(i, 1); } else if (i >= 0) rows[i] = op.r; else rows.push(op.r);
    s[op.c] = rows;
  });
  return s;
}
const strip = (st) => { const o = {}; COLLS.concat(TOPS).forEach((k) => { if (st[k] !== undefined) o[k] = st[k]; }); return copy(o); };

/** Every edit calls this: quests tick themselves, the device copy is saved, the server gets it shortly. */
function onChange(opts) {

}
function schedulePush() { if (!CLOUD.email) return; clearTimeout(CLOUD.pushT); setSync('pending'); CLOUD.pushT = setTimeout(push, 700); }
async function push() {
  CLOUD.pushT = null;
  if (CLOUD.inflight) { CLOUD.pushT = setTimeout(push, 500); return; }
  const snap = strip(S), ops = diffOps(CLOUD.base, snap);
  if (!ops.length) { setSync('saved'); return; }
  CLOUD.inflight = true; setSync('saving');
  try {
    const r = await api('state', { method: 'PUT', body: { ops } });
    CLOUD.base = snap; CLOUD.rev = r.rev; CLOUD.offline = false; saveCache(); setSync('saved');
    if (r.gifts && r.gifts.length) { await refreshMe(); celebrateGifts(r.gifts); }
  } catch (e) {
    if (e.status === 402) { S = normalize(copy(CLOUD.base || {})); saveCache(); requestRender(); upgradeSheet(e.message); }
    else if (e.status === 401) signOut(true);
    else if (e.status === 0 || e.status >= 500 || e.status === 429 || e.status === 409) { CLOUD.offline = e.status === 0; setSync(e.status === 0 ? 'offline' : 'retry'); CLOUD.pushT = setTimeout(push, e.status === 0 ? 8000 : 3000); }
    else { toast(esc(e.message), 'bad'); setSync('error'); }
  } finally { CLOUD.inflight = false; }
}
async function poll() {
  if (!CLOUD.email || CLOUD.inflight || CLOUD.pushT) return;
  try {
    const r = await api('state?since=' + CLOUD.rev);
    if (r.state !== undefined) {
      const pending = diffOps(CLOUD.base, strip(S)).filter((o) => !o.replace);
      CLOUD.base = strip(normalize(copy(r.state || {})));
      S = normalize(applyOpsJs(copy(CLOUD.base), pending));
      CLOUD.rev = r.rev; saveCache(); requestRender();
    }
    CLOUD.offline = false; if (!CLOUD.pushT) setSync('saved');

}

}

async function startApp(email) {
  CLOUD.email = email;
  document.documentElement.classList.remove('boot-out'); document.documentElement.classList.add('boot-app');
  const c = loadCache();
  if (c) { S = normalize(c.state); CLOUD.base = c.base; CLOUD.rev = c.rev || 0; ME = c.me || null; showApp(); }
  try {
    const [me, st] = await Promise.all([api('me'), api('state?since=-1')]);
    if (me.token) store.set('wk_token', me.token); // still using the app: stay signed in
    ME = me;
    const pending = c ? diffOps(CLOUD.base, strip(S)).filter((o) => !o.replace) : [];
    CLOUD.base = strip(normalize(copy(st.state || {}))); CLOUD.rev = st.rev;
    S = normalize(applyOpsJs(copy(CLOUD.base), pending));
    saveCache(); showApp(); if (pending.length) schedulePush();
  } catch (e) {
    if (e.status === 401) return signOut(true);
    if (!c) { document.documentElement.classList.add('boot-out'); toast('You’re offline. Open the app once with internet to set it up.', 'bad'); return; }
    CLOUD.offline = true; setSync('offline');
  }
  clearInterval(CLOUD.pollT); CLOUD.pollT = setInterval(() => { if (!document.hidden) { poll(); pollInbox(); } }, 30000);
  setTimeout(refreshMeEvery, 120000);
  afterStart();
}
function refreshMeEvery() { if (!document.hidden) refreshMe(); setTimeout(refreshMeEvery, 120000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && CLOUD.email) { poll(); pollInbox(); } });

function signOut(expired) {
  if (CLOUD.email) store.del(cacheKey());
  store.del('wk_token'); store.del('wk_email'); clearInterval(CLOUD.pollT);

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
async function enableReminders(hour) {
  if (!pushSupported()) { toast(/iPhone|iPad/.test(navigator.userAgent) ? 'On iPhone: tap Share → Add to Home Screen, open the app from there, then turn on reminders.' : 'This browser can’t show reminders.', 'bad'); return false; }

  if (perm !== 'granted') { toast('Notifications are blocked. Allow them in your browser settings.', 'bad'); return false; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const key = Uint8Array.from(atob(ME.vapid.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((ME.vapid.length + 3) % 4)), (c) => c.charCodeAt(0));
    const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key }));
    await api('push', { method: 'POST', body: { sub: { endpoint: sub.endpoint }, hour } });
    await saveAuthForWorker();
    S.profile.reminderHour = hour; onChange();
    return true;
  } catch (e) { toast(esc(e.message || 'Couldn’t turn on reminders'), 'bad'); return false; }
}

  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) { /* none */ }
  try { await api('push', { method: 'POST', body: { sub: null } }); } catch (e) { /* offline */ }

}

      <b style="font-family:var(--fh);font-size:17px">${p.emoji} ${esc(p.name)}</b><div class="sm muted">${plan ? esc(plan.phaseName) + ' phase' : ''}${CH().groupCode ? ' · with your group' : ''}</div>${CH().event && CH().event >= t ? `<div class="pill hot mt" style="margin-top:6px">💍 ${diff(t, CH().event) ? plural(diff(t, CH().event), 'day') + ' to the wedding' : 'Wedding day! 🎉'}</div>` : ''}</div></div>
      <div class="row mt sm"><span class="pill gold">Lv ${lv.level}</span><div class="xpbar sp"><i style="width:${lv.pct}%"></i></div><span class="muted tiny">${fmt(xp.total - lv.from)}/${fmt(lv.to - lv.from)} XP</span></div></div>`;

function cpTile(k, v, label, done, e) { return `<div class="cp ${done ? 'done' : ''}" data-act="cp" data-k="${k}"><span class="e">${e}</span><b>${v}</b><small>${label}</small></div>`; }
function lastWeight() { const r = S.days.filter((x) => num(x.weight) > 0).sort((a, b) => (a.id < b.id ? 1 : -1))[0]; return r ? r.weight : ''; }
function weekStrip(ref) {
  const m = monday(ref || today()), t = today(), from = CH() ? CH().start : (S.days.map((r) => r.id).sort()[0] || t);
  return `<div class="week">${[0, 1, 2, 3, 4, 5, 6].map((i) => { const d = shift(m, i), r = dayRow(d); const cls = isComplete(r) ? 'c' : r && r.fz ? 'z' : isLogged(r) ? 'l' : d < t && d >= from ? 'm' : ''; return `<div>${WD[(i + 1) % 7].slice(0, 2)}<i class="${cls} ${d === t ? 't' : ''}">${r && r.fz ? '🧊' : new Date(d + 'T12:00:00').getDate()}</i></div>`; }).join('')}</div>`;
}
function actsList(r) {
  const a = r.acts || []; if (!a.length) return '<p class="muted sm">Gym, a run, a game of badminton, a dance class… log anything you did.</p>';
  return a.map((x, i) => `<div class="li"><span class="e">${(ACTS.find((q) => q.id === x.t) || ACTS[ACTS.length - 1]).e}</span><div class="t"><b>${esc((ACTS.find((q) => q.id === x.t) || {}).n || x.t)}</b><small>${x.min ? x.min + ' min' : ''}${x.km ? ' · ' + x.km + ' km' : ''}${x.note ? ' · ' + esc(x.note) : ''}</small></div><button class="link" data-act="delact" data-i="${i}">Remove</button></div>`).join('');
}
const ACTS = [{ id: 'gym', e: '🏋️', n: 'Gym / weights' }, { id: 'run', e: '🏃', n: 'Run' }, { id: 'walk', e: '🚶', n: 'Walk' }, { id: 'cycle', e: '🚴', n: 'Cycling' }, { id: 'yoga', e: '🧘', n: 'Yoga class' }, { id: 'sport', e: '🏸', n: 'Sport' }, { id: 'swim', e: '🏊', n: 'Swim' }, { id: 'dance', e: '💃', n: 'Dance / Zumba' }, { id: 'hike', e: '🥾', n: 'Hike / trek' }, { id: 'other', e: '✨', n: 'Something else' }];

function workoutCard(plan, r) {
  const sess = plan.session, first = sess.blocks.find((b) => b.label !== 'Warm-up') || sess.blocks[0];
  const items = []; sess.blocks.forEach((b) => b.items.forEach((it) => { if (!items.some((x) => x.ex === it.ex && x.fast === it.fast)) items.push(it); }));
  const done = r.w || r.rest;
  return `<div class="card ${done ? '' : 'pulse'}"><div class="wo">${figureSvg(first.items[0].ex)}<div class="sp"><span class="pill ${plan.test ? 'gold' : 'hot'}">${plan.test ? '📈 Test day' : plan.rest ? '🌿 Recovery day' : 'Day ' + plan.n}</span><h3 style="margin-top:8px">${esc(sess.title)}</h3><div class="meta"><span>⏱ ~${plan.mins} min</span><span>${sess.blocks.reduce((a, b) => a + b.items.length * b.rounds, 0)} moves</span>${CH().adj && CH().adj !== 1 ? `<span>${CH().adj > 1 ? '⬆️ harder' : '⬇️ easier'}</span>` : ''}${checkinPill(r)}</div></div></div>
    <div class="exs">${items.map((it) => `<div class="ex" data-act="exinfo" data-ex="${it.ex}">${figureSvg(it.ex)}<b>${esc(EX[it.ex].n)}</b><small>${it.reps ? it.reps + ' reps' : fmtDur(it.secs)}${it.fast ? ' fast' : ''}</small></div>`).join('')}</div>
    ${done ? `<div class="row mt"><span class="pill ok">✓ ${r.rest && !r.w ? 'Rest day done' : 'Done' + (r.mins ? ' · ' + r.mins + ' min' : '')}</span><span class="sp"></span><button class="link" data-act="undo-w">Undo</button><button class="btn sm ghost" data-act="play">Do it again</button></div>`

    ${plan.test ? `<div class="banner warn mt" style="margin-bottom:0"><span class="e">📈</span><div class="sp"><b>Test yourself today</b><div class="sm muted">${PROGRAMS[CH().program].tests.map((x) => esc(x.name)).join(' · ')}</div></div><button class="btn sm" data-act="tests">Log tests</button></div>` : ''}</div>`;
}

function finishedCard() {

    <button class="btn big mt" data-act="nextch">Start my next challenge</button><button class="link mt" data-act="lifetime">Keep logging without a challenge</button></div>`;
}

function accessBanner() {

  $('#wd-ok').onclick = () => { const t = today(), r = ensureDay(t), mins = num($('#wd-m').value); r.acts = (r.acts || []).concat([{ t: $('#wd-t .on').dataset.v, min: mins }]); finishWorkout({ mins, own: true }); closeSheet(); }; };
ACT.restdone = () => { if (!canLog()) return; setDay(today(), { rest: 1, mob: Math.max(num((dayRow(today()) || {}).mob), T().mob) }); celebrateSmall('🌿', 'Rest day done', 'Recovery is part of the plan.'); };

ACT.setadj = (el) => { S.challenge.adj = Number(el.dataset.v); onChange(); closeSheet(); toast('Plan updated'); };

/* + / − buttons: tap for one step, keep pressing to count fast (speeds up the longer you hold). */
function holdRepeat(btn, step) {
  let t = null, n = 0;
  const stop = () => { clearTimeout(t); t = null; };
  const tick = () => { step(); n++; vibrate(5); t = setTimeout(tick, n < 6 ? 160 : n < 20 ? 80 : 40); };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); stop(); n = 0; step(); vibrate(8); t = setTimeout(tick, 400); try { btn.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(); } });
}

function checkpointSheet(k) {
  const t = today(), r = dayRow(t) || {};
  if (k === 'workout') {
    const plan = todayPlan();
    if (r.w || r.rest) { sheet(`<h2>Workout done ✓</h2><p class="muted">${r.mins ? r.mins + ' minutes' : ''}</p><button class="btn ghost big" data-act="undo-w" data-close>Undo</button>`); return; }
    if (plan) { startPlayer(plan); return; }
    ACT.wdone(); return;
  }
  const cfg = { water: { n: 'Water', u: 'glasses', step: 1, max: 30, e: '💧' }, sleep: { n: 'Sleep last night', u: 'hours', step: 0.5, max: 14, e: '😴' }, mob: { n: 'Stretching / mobility', u: 'minutes', step: 5, max: 120, e: '🧘' }, steps: { n: 'Steps', u: 'steps', step: 500, max: 60000, e: '👟' } }[k];
  let v = num(r[k]);
  if (k === 'water') { setDay(t, { water: v + 1 }); toast(`💧 ${v + 1} of ${T().water} glasses${v + 1 === T().water ? ' · goal hit!' : ''}`); vibrate(15); return; }
  sheet(`<h2>${cfg.e} ${cfg.n}</h2><div class="stepper"><button id="st-m">−</button><b id="st-v">${k === 'steps' ? fmt(v) : v}</b><button id="st-p">+</button></div><p class="c muted">${cfg.u} · goal ${k === 'steps' ? fmt(T()[k]) : T()[k]}</p>${k === 'steps' ? `<div class="chipsel" id="st-q" style="justify-content:center">${[1000, 2000, 5000, 8000, 10000].map((n, i) => `<button data-v="${n}" data-add="${i < 2 ? 1 : 0}">${i < 2 ? '+' : ''}${n / 1000}k</button>`).join('')}</div><input id="st-in" class="mt" type="number" inputmode="numeric" placeholder="Or type the number from your phone"><button class="btn ghost big mt" data-act="pedo">🚶 Count steps on a walk</button>` : ''}<button class="btn big mt" id="st-ok">Save</button>`);
  const show = () => { $('#st-v').textContent = k === 'steps' ? fmt(v) : v; };
  holdRepeat($('#st-m'), () => { v = Math.max(0, v - cfg.step); show(); }); holdRepeat($('#st-p'), () => { v = Math.min(cfg.max, v + cfg.step); show(); });
  if ($('#st-in')) $('#st-in').oninput = (e) => { v = num(e.target.value); show(); };
  $$('#st-q button').forEach((b) => (b.onclick = () => { v = Math.min(cfg.max, (b.dataset.add === '1' ? v : 0) + Number(b.dataset.v)); show(); vibrate(10); }));
  $('#st-ok').onclick = () => { setDay(t, { [k]: v || null }); closeSheet(); };
}

function activitySheet(day) {
  const d = day || today();

    <div class="grid2"><div><label class="f">Minutes</label><input id="ac-m" type="number" inputmode="numeric" value="30"></div><div><label class="f">Distance (km, optional)</label><input id="ac-k" type="number" inputmode="decimal" step="0.1"></div></div>
    <label class="f">Note (optional)</label><input id="ac-n" maxlength="80" placeholder="e.g. Leg day, 5x5 squats 60 kg">
    <label class="row mt"><input type="checkbox" id="ac-w" checked style="width:auto"> Count it as my workout for the day</label><button class="btn big mt" id="ac-ok">Save</button>`);
  $$('#ac-t button').forEach((b) => (b.onclick = () => $$('#ac-t button').forEach((x) => x.classList.toggle('on', x === b))));

}

function exerciseSheet(id) {

/** Workout finished (player or own): marks the day, then asks how it felt. */
function finishWorkout(o) {
  const t = today(), r = ensureDay(t), before = xpAll().total, wasComplete = isComplete(r);
  const now = new Date();
  r.w = 1; r.wt = pad(now.getHours()) + ':' + pad(now.getMinutes()); if (!o.own) r.mins = num(r.mins) + Math.round(o.mins || 0); // own workouts carry their minutes in the activity
  if (o.rest) r.rest = 1;
  onChange();
  const gained = xpAll().total - before, si = streakInfo();
  confetti(); chime(); vibrate([40, 60, 40]);
  sheet(`<div class="celebrate"><span class="e">${o.rest ? '🌿' : '🏆'}</span><h2>${o.rest ? 'Flow done!' : 'Workout done!'}</h2>
    <p class="muted">+${gained} XP${si.cur ? ` · 🔥 ${si.cur}-day streak` : ''}${!wasComplete && isComplete(r) ? ' · complete day!' : ''}</p>
    ${o.own ? '' : `<p><b>How did it feel?</b></p><div class="opts" style="grid-template-columns:1fr 1fr 1fr">${[['easy', '😌', 'Too easy'], ['ok', '💪', 'Just right'], ['hard', '🥵', 'Too hard']].map(([v, e, n]) => `<button class="opt" style="flex-direction:column;justify-content:center" data-act="rpe" data-v="${v}"><span style="font-size:28px">${e}</span><b>${n}</b></button>`).join('')}</div>`}
    ${isComplete(r) ? '' : `<p class="sm muted mt">Tick ${T().need - checkpoints(r)} more checkpoint${T().need - checkpoints(r) === 1 ? '' : 's'} (water, sleep, steps, stretching) for a complete day.</p>`}
    <button class="btn big mt" data-close>Done</button></div>`);
}
/** Two "too easy" in a row nudges the plan up 10%; one "too hard" eases it 10%. */
ACT.rpe = (el) => {
  const v = el.dataset.v, r = ensureDay(today()); r.rpe = v;
  const c = S.challenge;
  if (c) {
    const prev = S.days.filter((x) => x.id < today() && x.rpe).sort((a, b) => (a.id < b.id ? 1 : -1))[0];
    if (v === 'hard') { c.adj = Math.max(0.7, Math.round(((c.adj || 1) - 0.1) * 10) / 10); toast('Got it: the next workouts will be a bit easier.'); }
    else if (v === 'easy' && prev && prev.rpe === 'easy') { c.adj = Math.min(1.4, Math.round(((c.adj || 1) + 0.1) * 10) / 10); toast('Levelling up: the next workouts get a bit harder 🔥'); }
  }
  onChange(); closeSheet();
};
function celebrateSmall(e, title, sub) { confetti(70); chime(); sheet(`<div class="celebrate"><span class="e">${e}</span><h2>${esc(title)}</h2><p class="muted">${esc(sub)}</p><button class="btn big mt" data-close>Done</button></div>`); }
function celebrateGifts(gifts) {

}

/* ---------- picking a challenge ---------- */

      <div class="chipsel" id="w-len">${all.map((n) => `<button data-v="${n}" class="${st.length === n ? 'on' : ''}" ${ok.includes(n) ? '' : 'disabled style="opacity:.4"'}>${n} days</button>`).join('')}${free && !all.includes(freeDays) && ok[0] === freeDays ? `<button data-v="${freeDays}" class="on">${freeDays} days (free)</button>` : ''}</div>
      <label class="f">Start</label><div class="chipsel" id="w-st"><button data-v="${today()}" class="on">Today</button><button data-v="${shift(today(), 1)}">Tomorrow</button><button data-v="${mon}">Monday ${nice(mon)}</button></div>
      <div class="row mt"><button class="btn ghost" id="w-b">Back</button><button class="btn sp" id="w-n">Next</button></div>`);
    const pickLen = (n) => { st.length = n; $$('#w-len button').forEach((x) => x.classList.toggle('on', Number(x.dataset.v) === n)); };
    $$('#w-len button').forEach((b) => (b.onclick = () => { if (!b.disabled) pickLen(Number(b.dataset.v)); }));
    $$('#w-st button').forEach((b) => (b.onclick = () => { st.start = b.dataset.v; $$('#w-st button').forEach((x) => x.classList.toggle('on', x === b)); }));
    const ev = $('#w-ev'); if (ev) ev.onchange = () => {

      const days = diff(st.start, st.event) + 1, fit = ok.filter((n) => n <= days);
      $('#w-evm').textContent = days < 7 ? 'That’s very soon. Pick a short plan and focus on the yoga days.' : `${days} days to go. ${fit.length ? `We picked the ${fit[fit.length - 1]}-day plan so it ends by then.` : ''}`;
      if (fit.length) pickLen(fit[fit.length - 1]);

    const t = T();
    sheet(`<h2>Your daily goals</h2><p class="muted">The 5 checkpoints. A day is complete when you do the workout and hit enough of them.</p>

    $('#w-b').onclick = step2;
    $('#w-go').onclick = () => {
      if ($('#w-name') && $('#w-name').value.trim()) S.profile.name = $('#w-name').value.trim();

      if (CH() && !o.next) archiveChallenge('stopped');
      S.challenge = { id: uid(), program: st.program, length: st.length, start: st.start, adj: 1, groupCode: o.groupCode || null };
      if (PROGRAMS[st.program].event && st.event) S.challenge.event = st.event;
      onChange(); closeSheet(); confetti(); go('today');
      setTimeout(() => toast(st.start === today() ? 'Day 1! Start with the tests, then today’s workout.' : `See you on ${nice(st.start, true)}!`), 600);
    };
  };
  if (o.program) { st.program = o.program; if (o.length && !free) st.length = o.length; if (o.start) st.start = o.start; if (free) fixLength(); step3(); } else step1();
}
function archiveChallenge(status) {
  const c = CH(); if (!c) return;
  const to = shift(c.start, c.length - 1), days = S.days.filter((r) => r.id >= c.start && r.id <= to);
  S.challenges.push({ id: c.id || uid(), program: c.program, length: c.length, start: c.start, end: status === 'finished' ? to : today(), status, complete: days.filter(isComplete).length, workouts: days.filter((r) => r.w).length });
}

/* ===== player.js ===== */
/* ---------- the workout player: timers, reps, rest, voice and beeps ---------- */
const PL = { el: null, steps: [], i: 0, left: 0, run: false, t: null, started: 0, active: 0, lastTick: 0, plan: null, lock: null, half: false };

function startPlayer(plan) {
  if (!plan) return;
  PL.plan = plan; PL.steps = playerSteps(plan.session); PL.i = 0; PL.started = Date.now(); PL.active = 0;
  PL.el = document.createElement('div'); PL.el.className = 'player'; document.body.appendChild(PL.el);
  document.body.style.overflow = 'hidden';
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { PL.lock = l; }).catch(() => {}); } catch (e) { /* no wake lock */ }
  say(line('start', plan.session.title));
  loadStep(true);
}
function loadStep(autoStart) {
  const s = PL.steps[PL.i];
  if (!s) return endPlayer(true);
  PL.left = s.rest || s.secs || 0; PL.half = false;
  PL.run = !!(autoStart && (s.rest || s.secs));
  drawPlayer();
  const exLeft = PL.steps.slice(PL.i).filter((x) => x.ex).length, exAll = PL.steps.filter((x) => x.ex).length;
  if (s.rest) { const n = PL.steps[PL.i + 1]; if (n) say(line('rest', EX[n.ex].n, n.reps)); }
  else say((exLeft === 1 && exAll > 3 ? line('last') + ' ' : exAll > 6 && exLeft === Math.ceil(exAll / 2) ? line('half') + ' ' : '') + (s.reps ? line('reps', EX[s.ex].n, s.reps) : line('secs', EX[s.ex].n, s.secs)) + (s.fast ? '. ' + line('fast') : ''));
  clearInterval(PL.t); PL.lastTick = Date.now(); PL.t = setInterval(tick, 250);
}
function tick() {
  const now = Date.now(), dt = (now - PL.lastTick) / 1000; PL.lastTick = now;
  if (!PL.run) return;
  PL.active += dt;
  const s = PL.steps[PL.i]; if (!(s.rest || s.secs)) return;
  const before = Math.ceil(PL.left); PL.left -= dt; const after = Math.ceil(PL.left);
  if (after !== before) {
    if (after <= 3 && after > 0) beep(after === 1 ? 990 : 660, 120);
    if (s.ex && EX[s.ex].side && !PL.half && PL.left <= (s.secs || 0) / 2) { PL.half = true; say(line('side')); beep(520, 200); }
    if (s.secs >= 120 && after > 0 && after % 60 === 0) say(line('left', after / 60));
  }
  if (PL.left <= 0) { beep(1320, 280); vibrate(80); PL.i++; loadStep(true); return; }
  updateTimer();
}
function drawPlayer() {
  const s = PL.steps[PL.i], next = PL.steps.slice(PL.i + 1).find((x) => x.ex);
  const pct = Math.round((PL.i / PL.steps.length) * 100);
  PL.el.classList.toggle('resting', !!s.rest);
  const ex = s.ex ? EX[s.ex] : null;
  PL.el.innerHTML = `<div class="pl-top"><button class="iconbtn" id="pl-x" aria-label="End">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="tiny muted">${PL.i + 1}/${PL.steps.length}</span></div>
    <div class="pl-main">
      <div class="tiny muted">${esc(s.label || '')}</div>
      ${s.rest ? `<div style="font-size:64px">😮‍💨</div><h2 class="pl-rest">Rest</h2>` : `${figureSvg(s.ex)}<h2>${esc(ex.n)}${s.fast ? ' · fast!' : ''}</h2>`}
      ${s.rest || s.secs ? `<div class="pl-timer" id="pl-t">${clockOf(PL.left)}</div>` : `<div class="pl-reps">${s.reps}<small> reps</small></div>`}
      <div class="pl-cue" id="pl-cue">${ex ? esc(ex.cues[0]) : next ? 'Next: <b>' + esc(EX[next.ex].n) + '</b>' + (next.reps ? ' · ' + next.reps + ' reps' : ' · ' + fmtDur(next.secs)) : 'Last one done!'}</div>
      ${!s.rest && next ? `<div class="pl-next">Next: ${esc(EX[next.ex].n)}</div>` : ''}
    </div>
    <div class="pl-ctl"><button id="pl-prev" aria-label="Back">⏮</button>
      ${s.rest || s.secs ? `<button class="main" id="pl-pp" aria-label="Pause">${PL.run ? '⏸' : '▶'}</button>` : `<button class="main" id="pl-done" aria-label="Done">✓</button>`}
      <button id="pl-next" aria-label="Skip">⏭</button></div>
    <div class="row mt" style="justify-content:center;gap:18px"><button class="link" id="pl-snd">${S.prefs.sound ? '🔊 Sound on' : '🔇 Sound off'}</button><button class="link" id="pl-vc">${S.prefs.voice ? '🗣 Voice on' : '🤐 Voice off'}</button>${S.prefs.voice ? `<button class="link" id="pl-lang">${HI() ? 'हिं → EN' : 'EN → हिं'}</button>` : ''}${s.rest ? '<button class="link" id="pl-add">+20s</button>' : ex ? '<button class="link" id="pl-info">How to</button>' : ''}</div>`;
  $('#pl-x', PL.el).onclick = askEnd;
  $('#pl-prev', PL.el).onclick = () => { PL.i = Math.max(0, PL.i - 1); loadStep(false); };
  $('#pl-next', PL.el).onclick = () => { PL.i++; loadStep(true); };
  const pp = $('#pl-pp', PL.el); if (pp) pp.onclick = () => { PL.run = !PL.run; pp.textContent = PL.run ? '⏸' : '▶'; if (PL.run) beep(880, 80); };
  const dn = $('#pl-done', PL.el); if (dn) dn.onclick = () => { beep(1320, 160); vibrate(40); PL.i++; loadStep(true); };
  const add = $('#pl-add', PL.el); if (add) add.onclick = () => { PL.left += 20; updateTimer(); };
  const info = $('#pl-info', PL.el); if (info) info.onclick = () => { PL.run = false; drawPlayer(); exerciseSheet(s.ex); };
  $('#pl-snd', PL.el).onclick = () => { S.prefs.sound = !S.prefs.sound; onChange({ quiet: true }); drawPlayer(); };
  $('#pl-vc', PL.el).onclick = () => { S.prefs.voice = !S.prefs.voice; if (!S.prefs.voice && window.speechSynthesis) speechSynthesis.cancel(); onChange({ quiet: true }); drawPlayer(); };
  const lg = $('#pl-lang', PL.el); if (lg) lg.onclick = () => { S.prefs.lang = HI() ? 'en' : 'hi'; onChange({ quiet: true }); drawPlayer(); say(HI() ? 'हिंदी में कोच' : 'Coach in English'); };
  if (ex) { let ci = 0; clearInterval(PL.cueT); PL.cueT = setInterval(() => { const c = $('#pl-cue', PL.el); if (!c || !ex.cues.length) return; ci = (ci + 1) % ex.cues.length; c.textContent = ex.cues[ci]; }, 4000); }
  animateFigures();
}
function updateTimer() { const t = $('#pl-t', PL.el); if (t) t.textContent = clockOf(PL.left); }
const clockOf = (sec) => { sec = Math.max(0, Math.ceil(sec)); const m = Math.floor(sec / 60), x = sec % 60; return m + ':' + pad(x); };
function askEnd() {
  PL.run = false; drawPlayer();
  const mins = Math.round(PL.active / 60);
  sheet(`<h2>End the workout?</h2><p class="muted">You’ve done ${PL.i} of ${PL.steps.length} steps (${mins} min).</p><button class="btn big" id="pe-keep">Keep going</button>${PL.i >= PL.steps.length * 0.6 ? '<button class="btn ghost big mt" id="pe-save">Finish and count it</button>' : ''}<button class="link mt" id="pe-quit" style="display:block;margin:12px auto 0">Quit without saving</button>`);
  $('#pe-keep').onclick = () => { closeSheet(); PL.run = true; drawPlayer(); };
  if ($('#pe-save')) $('#pe-save').onclick = () => { closeSheet(); endPlayer(true); };
  $('#pe-quit').onclick = () => { closeSheet(); endPlayer(false); };
}
function endPlayer(done) {
  clearInterval(PL.t); clearInterval(PL.cueT);
  try { PL.lock && PL.lock.release(); } catch (e) { /* none */ }
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (PL.el) PL.el.remove(); PL.el = null; document.body.style.overflow = '';
  if (done) { say(line('done')); finishWorkout({ mins: Math.max(1, Math.round((Date.now() - PL.started) / 60000)), rest: PL.plan && PL.plan.rest }); }
}

/* ===== progress.js ===== */
/* ---------- Progress: dashboard, challenge map, body, photos, lifetime ---------- */
function barChart(vals, labels, o) {
  o = o || {}; const W = 320, H = 130, pad = 18, max = Math.max(1, ...vals), bw = (W - pad) / vals.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${[0.5, 1].map((f) => `<line class="gl" x1="${pad}" x2="${W}" y1="${H - 18 - (H - 30) * f}" y2="${H - 18 - (H - 30) * f}"/>`).join('')}
    ${vals.map((v, i) => { const h = Math.max(((H - 30) * v) / max, v ? 2 : 0); return `${h ? `<rect class="${o.cls || 'bar'}" x="${pad + i * bw + bw * 0.18}" y="${H - 18 - h}" width="${bw * 0.64}" height="${h}" rx="${Math.min(3, h / 2)}"/>` : ''}${labels && (vals.length <= 12 || i % 2 === 0) ? `<text x="${pad + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${esc(labels[i])}</text>` : ''}`; }).join('')}
    <text x="0" y="12">${fmt(max)}${o.unit ? ' ' + o.unit : ''}</text></svg>`;
}
function lineChart(pts, o) {
  o = o || {}; if (pts.length < 2) return '<p class="muted sm">Log at least two entries to see a chart.</p>';
  const W = 320, H = 140, px = 30, ys = pts.map((p) => p[1]), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const x = (i) => px + (i * (W - px - 8)) / (pts.length - 1), y = (v) => 12 + (H - 34) * (1 - (v - lo) / span);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="gl" x1="${px}" x2="${W}" y1="${y(hi)}" y2="${y(hi)}"/><line class="gl" x1="${px}" x2="${W}" y1="${y(lo)}" y2="${y(lo)}"/>
    <text x="0" y="${y(hi) + 3}">${hi}</text><text x="0" y="${y(lo) + 3}">${lo}</text><path class="ar" d="${d}L${x(pts.length - 1)} ${H - 22}L${x(0)} ${H - 22}Z"/><path class="ln" d="${d}"/>

let PHOTOS = null;
PROG_TABS.photos = function () {

};
async function loadPhotos(force) {
  if (PHOTOS && !force) { bindPhotoInput(); return; }
  try { PHOTOS = await api('photos'); if (ROUTE === 'progress' && SUB.progress === 'photos') render(); } catch (e) { const m = $('#main'); if (m && SUB.progress === 'photos') m.querySelector('.empty') && (m.querySelector('.empty').innerHTML = '<span class="e">📶</span>' + esc(e.status === 0 ? 'Photos need internet.' : e.message)); }
}
function bindPhotoInput() { const i = $('#ph-in'); if (i) i.onchange = () => i.files[0] && uploadPhoto(i.files[0]); }
async function shrink(file) {
  const img = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error('Couldn’t read that photo')); im.src = URL.createObjectURL(file); });
  const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.84));
}
async function uploadPhoto(file) {
  if (!canLog()) return;
  toast('Uploading…');
  try {
    const blob = await shrink(file);
    const s = await api('photos/sign', { method: 'POST', body: { day: today() } });
    const fd = new FormData(); Object.entries(s.fields).forEach(([k, v]) => fd.append(k, v)); fd.append('file', blob, 'photo.jpg');
    const up = await fetch(s.url, { method: 'POST', body: fd }); if (!up.ok) throw new Error('Upload failed. Try again.');
    await api('photos/confirm', { method: 'POST', body: { id: s.id } });
    await loadPhotos(true); confetti(60); toast('📸 Saved. See you next week!');
  } catch (e) { if (e.status === 402 && e.data && e.data.reason === 'photos') upgradeSheet(e.message); else toast(esc(e.message), 'bad'); }
}
ACT.phview = (el) => { const p = PHOTOS.photos.find((x) => x.id === el.dataset.id); sheet(`<img src="${esc(p.url)}" style="width:100%;border-radius:18px" alt=""><p class="muted c">${nice(p.day, true)}</p><button class="link" id="ph-del" style="display:block;margin:auto">Delete photo</button><p class="tiny muted c">Deleting doesn’t give the week’s photo back.</p>`); $('#ph-del').onclick = async () => { try { await api('photos/delete', { method: 'POST', body: { id: p.id } }); closeSheet(); loadPhotos(true); } catch (e) { toast(esc(e.message), 'bad'); } }; };
/* Before / after: drag the line across the photo; pick any two photos to compare. */
ACT.phcmp = (el, ev, ai, bi) => {
  const ps = PHOTOS.photos.slice().sort((x, y) => (x.day < y.day ? -1 : 1));
  ai = ai == null ? 0 : ai; bi = bi == null ? ps.length - 1 : bi;
  const a = ps[ai], b = ps[bi], days = diff(a.day, b.day);
  const opt = (sel) => ps.map((p, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${nice(p.day)}</option>`).join('');
  sheet(`<h2>Before / after</h2><p class="muted sm">${days > 0 ? plural(days, 'day') + ' apart. ' : ''}Drag across the photo.</p><div class="cmp" id="cmp"><img src="${esc(a.url)}" alt="Before"><img class="b" id="cmp-b" src="${esc(b.url)}" alt="After"><span class="cmp-l" id="cmp-l"><i></i></span><em class="cmp-t l">Before</em><em class="cmp-t r">After</em></div>
    <div class="grid2 mt"><select id="cmp-a">${opt(ai)}</select><select id="cmp-z">${opt(bi)}</select></div>`);
  const box = $('#cmp'), set = (pct) => { pct = clamp(pct, 0, 100); $('#cmp-b').style.clipPath = `inset(0 0 0 ${pct}%)`; $('#cmp-l').style.left = pct + '%'; };
  const at = (e) => { const r = box.getBoundingClientRect(); set(((e.clientX - r.left) / r.width) * 100); };
  let drag = false;
  box.addEventListener('pointerdown', (e) => { drag = true; box.setPointerCapture(e.pointerId); at(e); });
  box.addEventListener('pointermove', (e) => { if (drag) at(e); });
  ['pointerup', 'pointercancel'].forEach((t) => box.addEventListener(t, () => { drag = false; }));
  set(50);
  $('#cmp-a').onchange = () => ACT.phcmp(null, null, Number($('#cmp-a').value), bi);
  $('#cmp-z').onchange = () => ACT.phcmp(null, null, ai, Number($('#cmp-z').value));
};

/* ---------- Excel tracker import ---------- */
function loadXlsx() { return window.XLSX ? Promise.resolve() : new Promise((ok, bad) => { const s = document.createElement('script'); s.src = '/planner/xlsx.mini.min.js'; s.onload = ok; s.onerror = () => bad(new Error('Couldn’t load the Excel reader. Check your connection.')); document.body.appendChild(s); }); }
const normH = (h) => String(h == null ? '' : h).toLowerCase().replace(/[^a-z0-9%]+/g, ' ').trim();
function xlDate(v) {
  if (v instanceof Date && !isNaN(v)) return dstr(v);
  if (typeof v === 'number' && v > 30000 && v < 80000) return dstr(new Date(Math.round((v - 25569) * 864e5) + new Date().getTimezoneOffset() * 6e4));
  if (typeof v === 'string') { const m = v.trim().match(/^(\d{1,2})[/\-. ](\d{1,2}|[A-Za-z]{3,})[/\-. ](\d{2,4})$/); if (m) { const mo = isNaN(m[2]) ? MONTHS.findIndex((x) => m[2].slice(0, 3).toLowerCase() === x.toLowerCase()) + 1 : Number(m[2]); const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]); if (mo > 0) return `${y}-${pad(mo)}-${pad(Number(m[1]))}`; } const d = new Date(v); if (!isNaN(d)) return dstr(d); }
  return null;
}
const yes = (v) => v === true || v === 1 || /^(y|yes|done|✓|✔|✅|true|x|1)$/i.test(String(v == null ? '' : v).trim());
/** Finds the header row (the first row with a "date" column) and returns rows as objects keyed by matched names. */
function tableOf(rows, want) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const hs = (rows[i] || []).map(normH), di = hs.findIndex((h) => h === 'date' || h.startsWith('date') || h === 'day date');
    if (di < 0) continue;
    const col = {}; Object.entries(want).forEach(([k, keys]) => { const j = hs.findIndex((h) => keys.some((w) => h === w || h.startsWith(w + ' ') || h.includes(w))); if (j >= 0) col[k] = j; }); col.date = di;
    return rows.slice(i + 1).map((r) => { const o = {}; Object.entries(col).forEach(([k, j]) => { o[k] = r[j]; }); return o; }).filter((o) => xlDate(o.date));
  }
  return [];
}
async function importExcel(file) {
  try {
    toast('Reading your file…'); await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const sheetBy = (...names) => { const n = wb.SheetNames.find((s) => names.some((x) => s.toLowerCase().includes(x))); return n ? XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null }) : null; };
    const out = { days: {}, meals: [], body: [], prs: [] };
    const daily = sheetBy('daily', 'tracker', 'log') || (wb.SheetNames.length === 1 ? sheetBy(wb.SheetNames[0].toLowerCase()) : null);
    if (daily) tableOf(daily, { w: ['workout done', 'workout', 'exercise'], water: ['water', 'glasses'], sleep: ['sleep'], steps: ['steps'], mob: ['mobility', 'stretch'], mood: ['mood'], weight: ['weight'], mins: ['minutes', 'duration'], note: ['note', 'notes', 'comment'] }).forEach((o) => {
      const d = xlDate(o.date), r = {}; if (yes(o.w) || num(o.w) > 0) r.w = 1; ['water', 'sleep', 'steps', 'mob', 'weight', 'mins'].forEach((k) => { if (num(o[k]) > 0) r[k] = num(o[k]); }); if (num(o.mood) >= 1 && num(o.mood) <= 5) r.mood = Math.round(num(o.mood)); if (o.note) r.note = String(o.note).slice(0, 200);
      if (Object.keys(r).length) out.days[d] = r;
    });
    const meals = sheetBy('meal', 'food', 'diet');
    if (meals) tableOf(meals, { n: ['food', 'meal', 'item', 'dish'], kcal: ['calories', 'kcal', 'cal'], p: ['protein'], slot: ['meal type', 'time'] }).forEach((o) => { if (o.n || num(o.kcal)) out.meals.push({ id: uid(), d: xlDate(o.date), n: String(o.n || 'Meal').slice(0, 60), kcal: Math.round(num(o.kcal)), p: num(o.p), slot: /break/i.test(o.slot) ? 'b' : /lunch/i.test(o.slot) ? 'l' : /dinner/i.test(o.slot) ? 'd' : 's' }); });
    const body = sheetBy('body', 'measure');
    if (body) tableOf(body, { weight: ['weight'], waist: ['waist'], chest: ['chest'], hips: ['hip'], arm: ['arm', 'bicep'], thigh: ['thigh'], fat: ['body fat', 'fat'] }).forEach((o) => { const b = { id: uid(), d: xlDate(o.date) }; let any = 0; ['weight', 'waist', 'chest', 'hips', 'arm', 'thigh', 'fat'].forEach((k) => { if (num(o[k]) > 0) { b[k] = num(o[k]); any++; } }); if (any) out.body.push(b); });
    const pr = sheetBy('pr', 'record', 'test');
    if (pr) tableOf(pr, { test: ['test', 'exercise', 'name'], v: ['result', 'value', 'score', 'reps', 'time'] }).forEach((o) => { if (o.test && o.v != null && o.v !== '') { const name = normH(o.test); let id = null; PROGRAM_IDS.forEach((k) => PROGRAMS[k].tests.forEach((t) => { if (!id && (normH(t.name).includes(name) || name.includes(normH(t.name).split(' ')[0]))) id = t.id; })); out.prs.push({ id: uid(), d: xlDate(o.date), test: id || 'custom:' + String(o.test).slice(0, 30), v: num(o.v) }); } });
    const nDays = Object.keys(out.days).length;
    if (!nDays && !out.meals.length && !out.body.length && !out.prs.length) { toast('Couldn’t find any logs in that file. Use the Pandora Workout Challenge tracker (Daily Tracker, Meal Log, Body Log, PR Tracker sheets).', 'bad'); return; }
    sheet(`<h2>Import from Excel</h2><p class="muted">Found in <b>${esc(file.name)}</b>:</p><div class="li"><span class="e">📅</span><div class="t"><b>${nDays} days</b><small>workouts, water, sleep, steps, mood, weight</small></div></div><div class="li"><span class="e">🍽</span><div class="t"><b>${out.meals.length} meals</b></div></div><div class="li"><span class="e">📏</span><div class="t"><b>${out.body.length} body check-ins</b></div></div><div class="li"><span class="e">📈</span><div class="t"><b>${out.prs.length} test results</b></div></div>
      <p class="sm muted">Days you’ve already logged in the app keep their app values; empty fields are filled from the sheet. Imported days count for your stats and badges, but not for gifts or money-back.</p><button class="btn big" id="ix-ok">Import</button>`);
    $('#ix-ok').onclick = () => {
      Object.entries(out.days).forEach(([d, r]) => { const cur = ensureDay(d); Object.entries(r).forEach(([k, v]) => { if (cur[k] == null || cur[k] === '') cur[k] = v; }); });
      const has = new Set(S.meals.map((m) => m.d + '|' + m.n)); out.meals.forEach((m) => { if (!has.has(m.d + '|' + m.n)) S.meals.push(m); });
      const hb = new Set(S.body.map((b) => b.d)); out.body.forEach((b) => { if (!hb.has(b.d)) S.body.push(b); });
      const hp = new Set(S.prs.map((p) => p.d + '|' + p.test)); out.prs.forEach((p) => { if (!hp.has(p.d + '|' + p.test)) S.prs.push(p); });
      onChange(); closeSheet(); confetti(100); toast(`Imported ${nDays} days 🎉`);
    };
  } catch (e) { toast(esc(e.message || 'Couldn’t read that file'), 'bad'); }
}

/* ===== morning check-in: 10 seconds that shape today's workout ===== */
const ENERGY = [['😫', 'Drained'], ['😕', 'Low'], ['😐', 'Okay'], ['🙂', 'Good'], ['🤩', 'Great']];
/** Today's workout size from the check-in: tired or short on sleep → 20% lighter; great and rested → 10% harder. */
function checkinScale(row) {
  if (!row || !row.ci) return 1;
  const sl = num(row.sleep);
  if (row.ci <= 2 || (sl && sl < 5.5)) return 0.8;
  if (row.ci >= 5 && (!sl || sl >= 7)) return 1.1;
  return 1;
}
function checkinPill(row) {
  const k = checkinScale(row);
  return k < 1 ? '<span>😴 lighter today</span>' : k > 1 ? '<span>⚡ a bit harder today</span>' : '';
}
function checkinCard(row) {
  if (row && row.ci) return '';
  const hr = new Date().getHours();
  if (hr >= 15 || (row && (row.w || row.rest))) return '';
  const sl = num(row && row.sleep);
  return `<div class="card ckin"><h3>☀️ Morning check-in<span class="sp"></span><span class="muted tiny">10 seconds</span></h3>
    <label class="f" style="margin-top:0">How long did you sleep?</label><div class="chipsel" id="ck-sl">${[5, 6, 7, 8, 9].map((h) => `<button data-v="${h}" class="${sl === h ? 'on' : ''}">${h === 5 ? '≤5' : h === 9 ? '9+' : h} h</button>`).join('')}</div>
    <label class="f">How’s your energy?</label><div class="moods" id="ck-en">${ENERGY.map(([e, n], i) => `<button data-v="${i + 1}" title="${n}">${e}</button>`).join('')}</div>
    <p class="tiny muted mt">Tired days get a lighter workout. Great days get a little extra.</p></div>`;
}
function bindCheckin() {
  const box = $('.ckin'); if (!box) return;
  let sl = num((dayRow(today()) || {}).sleep) || 0;
  $$('#ck-sl button', box).forEach((b) => (b.onclick = () => { sl = Number(b.dataset.v); $$('#ck-sl button', box).forEach((x) => x.classList.toggle('on', x === b)); }));
  $$('#ck-en button', box).forEach((b) => (b.onclick = () => {
    if (!canLog()) return;
    const ci = Number(b.dataset.v), r = dayRow(today()) || {};
    const patch = { ci, mood: r.mood || ci }; if (sl) patch.sleep = sl;
    setDay(today(), patch); vibrate(20);
    const k = checkinScale(dayRow(today()));
    toast(k < 1 ? '😴 Got it. Today’s workout is 20% lighter. Showing up is what counts.' : k > 1 ? '⚡ Feeling great! Today’s workout is a bit harder.' : '👍 Thanks! Today’s plan stays as it is.');

  }

  const rounds = clamp(Math.floor(450 / Math.max(60, roundSecs)), 1, 3);

/* ===== step counter: counts steps with the phone's motion sensor while this screen is open ===== */
const PEDO = { on: false, n: 0, last: 0, avg: 9.8, prev: 0, lock: null, h: null };
function pedoStep(e) {
  const a = e.accelerationIncludingGravity; if (!a) return;
  const m = Math.sqrt((a.x || 0) ** 2 + (a.y || 0) ** 2 + (a.z || 0) ** 2);
  PEDO.avg = PEDO.avg * 0.95 + m * 0.05; // slow average = gravity
  const v = m - PEDO.avg, now = Date.now();
  if (PEDO.prev <= 1.2 && v > 1.2 && now - PEDO.last > 280) { PEDO.n++; PEDO.last = now; const el = $('#pd-n'); if (el) el.textContent = fmt(PEDO.n); }
  PEDO.prev = v;
}
async function pedoStart() {
  try { if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' && (await DeviceMotionEvent.requestPermission()) !== 'granted') { toast('Allow motion access to count steps.', 'bad'); return false; } } catch (e) { toast('Allow motion access to count steps.', 'bad'); return false; }
  if (!('ondevicemotion' in window)) { toast('This phone can’t count steps in the browser. Type them in from your phone’s health app instead.', 'bad'); return false; }
  PEDO.on = true; PEDO.n = 0; PEDO.last = 0; PEDO.prev = 0;
  window.addEventListener('devicemotion', pedoStep);
  try { if (navigator.wakeLock) PEDO.lock = await navigator.wakeLock.request('screen'); } catch (e) { /* none */ }
  return true;
}
function pedoStop() { PEDO.on = false; window.removeEventListener('devicemotion', pedoStep); try { PEDO.lock && PEDO.lock.release(); } catch (e) { /* none */ } PEDO.lock = null; }

const VOICE = { rec: null, chunks: [], t0: 0, timer: null, stream: null };
function voiceSupported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
/** Opens the recorder; `send(voice)` posts { id, secs } where the message should go. */
function voiceSheet(toName, send) {
  if (!voiceSupported()) return toast('This browser can’t record audio.', 'bad');
  sheet(`<div class="c"><span style="font-size:52px" id="vr-e">🎤</span><h2>Voice note${toName ? ' to ' + esc(toName) : ''}</h2><p class="muted" id="vr-m">Up to 15 seconds. Say something nice!</p><div class="pl-timer" id="vr-t">0:00</div>
    <button class="btn big mt" id="vr-go">● Record</button><button class="link mt" data-close style="display:block;margin:10px auto 0">Cancel</button></div>`);
  const btn = $('#vr-go');
  const stopAll = () => { clearInterval(VOICE.timer); try { VOICE.stream && VOICE.stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* none */ } };
  btn.onclick = async () => {
    if (VOICE.rec && VOICE.rec.state === 'recording') { VOICE.rec.stop(); return; }
    try { VOICE.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast('Allow the microphone to record.', 'bad'); }
    VOICE.chunks = []; VOICE.rec = new MediaRecorder(VOICE.stream); VOICE.t0 = Date.now();
    VOICE.rec.ondataavailable = (e) => { if (e.data && e.data.size) VOICE.chunks.push(e.data); };
    VOICE.rec.onstop = async () => {
      stopAll();
      const secs = Math.max(1, Math.min(15, Math.round((Date.now() - VOICE.t0) / 1000)));
      const blob = new Blob(VOICE.chunks, { type: VOICE.rec.mimeType || 'audio/webm' });
      if (!$('#vr-go')) return; // closed
      btn.disabled = true; btn.textContent = 'Sending…'; $('#vr-e').textContent = '📤';
      try {

        const fd = new FormData(); Object.entries(up.fields).forEach(([k, v]) => fd.append(k, v)); fd.append('file', blob, 'voice');
        const res = await fetch(up.url, { method: 'POST', body: fd }); if (!res.ok) throw new Error('Upload failed. Try again.');
        await send({ id: up.id, secs }); closeSheet(); toast('🎤 Sent!'); markCheered();
      } catch (e) { toast(esc(e.message || 'Couldn’t send'), 'bad'); btn.disabled = false; btn.textContent = '● Record again'; }
    };
    VOICE.rec.start(); btn.textContent = '■ Stop & send'; $('#vr-e').textContent = '🔴'; vibrate(30);
    VOICE.timer = setInterval(() => { const sec = Math.floor((Date.now() - VOICE.t0) / 1000); const t = $('#vr-t'); if (t) t.textContent = '0:' + pad(sec); else { clearInterval(VOICE.timer); if (VOICE.rec.state === 'recording') { VOICE.chunks = []; VOICE.rec.onstop = stopAll; VOICE.rec.stop(); } } if (sec >= 15 && VOICE.rec.state === 'recording') VOICE.rec.stop(); }, 250);
  };
}

/* ===== pledge: put money on finishing your challenge ===== */
function pledgeNow() { const p = ME && ME.pledge; return p && p.list ? p.list.find((x) => x.status === 'active') : null; }
function pledgeOffer() {
  const p = ME && ME.pledge, c = CH(), st = chStatus();
  if (!p || !p.on || !c || !st || st.over || pledgeNow()) return null;
  if (p.list.some((x) => x.challengeId === c.id)) return null;
  const start = c.start > today() ? c.start : today(), end = shift(c.start, c.length - 1), days = diff(start, end) + 1;
  return days >= p.minDays ? { days, needed: Math.ceil((days * p.needPercent) / 100) } : null;
}
function pledgeCard(where) {
  const p = ME && ME.pledge; if (!p) return '';
  const now = pledgeNow(), recent = p.list.find((x) => ['won', 'lost', 'refunded', 'donated'].includes(x.status) && diff(x.end, today()) <= 10);
  if (now) {
    const left = Math.max(0, diff(today(), now.end) + 1), canStill = now.counted + left >= now.needed, pct = clamp((now.counted / now.needed) * 100, 0, 100);
    return `<div class="card pledge"><h3>💰 ₹${fmt(now.amount)} on the line<span class="sp"></span><span class="pill ${canStill ? 'gold' : ''}">${now.counted}/${now.needed}</span></h3><div class="bar" style="height:12px"><i style="width:${pct}%;background:linear-gradient(90deg,var(--gold),var(--ok))"></i></div>
      <p class="sm muted mt">${now.counted >= now.needed ? '🏆 Target reached! Keep logging; your refund comes after the last day.' : canStill ? `${now.needed - now.counted} more complete days in the next ${plural(left, 'day')}. Miss it and it goes to ${esc(now.charity)}.` : `Out of reach this time: it goes to ${esc(now.charity)}. Finish strong anyway!`}</p></div>`;
  }
  if (recent && where === 'rewards') return `<div class="card"><h3>💰 Last pledge</h3><p>${recent.status === 'won' || recent.status === 'refunded' ? `🏆 You won! ₹${fmt(recent.amount)} ${recent.status === 'refunded' ? 'has been refunded' : 'is on its way back to you'}.` : `You did ${recent.counted} of ${recent.needed} days. ₹${fmt(recent.amount)} ${recent.status === 'donated' ? 'was given' : 'goes'} to ${esc(recent.charity)}.`}</p></div>`;
  const o = pledgeOffer(); if (!o) return '';
  if (where === 'today' && (chDay() > 3 || S.game.pledgeNo === CH().id)) return '';
  return `<div class="card pledge"><h3>💰 Put money on it?</h3><p class="sm muted">People who stake something are far more likely to finish. Pledge ₹${p.amounts.join(' / ₹')}: complete ${o.needed} of the next ${o.days} days and get it all back. Miss, and it goes to <b>${esc(p.charity)}</b>.</p>
    <div class="row mt"><button class="btn" data-act="pledge">Make a pledge</button>${where === 'today' ? '<button class="link" data-act="pledgeno">Not now</button>' : ''}</div></div>`;
}
ACT.pledgeno = () => { S.game.pledgeNo = CH().id; onChange({ quiet: true }); render(); };
ACT.pledge = () => {

// LOGO is defined by the build (the same mark as in the menu).
const INSTALL = { evt: null };
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); INSTALL.evt = e; const b = $('#install'); if (b) b.hidden = false; const m = $('#me-install'); if (m) m.hidden = false; });
async function doInstall() { if (!INSTALL.evt) return; INSTALL.evt.prompt(); try { await INSTALL.evt.userChoice; } catch (e) { /* none */ } INSTALL.evt = null; $('#install').hidden = true; }
$('#install').onclick = doInstall;

function showApp() {
  $('#lp').innerHTML = '';
  document.documentElement.classList.remove('boot-out'); document.documentElement.classList.add('boot-app');
  applyTheme(); setSync(CLOUD.offline ? 'offline' : 'saved'); render(); renderNavBadges();
}
function afterStart() {
  saveAuthForWorker();
  pollInbox();
  if (doHash()) return;
  const join = store.get('wk_join');
  if (join) { joinFlow(join); return; }
  if (!CH() && !S.days.length && !S.challenges.length) setTimeout(() => setupWizard(), 500);
}

/* links people arrive with: ?ref=CODE (a friend's referral), ?join=CODE (a group invite), utm_* (ads) */
(function readLink() {
  const q = new URLSearchParams(location.search);
  if (q.get('ref')) store.set('wk_ref', q.get('ref').toUpperCase().slice(0, 12));
  if (q.get('join')) store.set('wk_join', q.get('join').toLowerCase().slice(0, 12));
  const src = [q.get('utm_source'), q.get('utm_campaign'), q.get('utm_content')].filter(Boolean).join(' / ');
  if (src && !store.get('wk_src')) store.set('wk_src', src.slice(0, 120));
  if (q.toString()) history.replaceState(null, '', location.pathname + location.hash);
})();

/* offline worker: the app opens with no internet once it has been opened online */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/workout-sw.js', { scope: '/workout' }).catch((e) => console.warn('offline worker', e)); });
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.type === 'open' && e.data.hash) location.hash = e.data.hash; });
}

S = normalize({});
const email = store.get('wk_email');
if (tok() && email) startApp(email);
else {
  showLanding();
  if (location.pathname.endsWith('/signup') || store.get('wk_join')) setTimeout(() => gate('signup'), 300);
  else if (location.pathname.endsWith('/login')) setTimeout(() => gate('login'), 300);
}

window.WK = { get S() { return S; }, get ME() { return ME; }, PL, loadStep, xpAll, dayRow, today, CLOUD, stats, render };
