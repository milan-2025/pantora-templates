<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><base href="/CRM/"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Platform admin – LeadFlow</title>
<style>:root{--bg:#f3f5f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--bad:#dc2626}@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#1a1f26;--tx:#e8eaed;--mut:#98a2b3;--bd:#2b323b;--ac:#6ea0ff;--bad:#f87171}}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:14px}h1{font-size:19px;margin:0 0 4px}.sc{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--bd)}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{font-size:12px;color:var(--mut)}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}a{color:var(--ac)}.mut{color:var(--mut)}.bad{color:var(--bad)}</style></head><body>
<a href="index.html">← Back to CRM</a><h1>Platform admin</h1><div class="mut" id="sum">Loading…</div><div class="sc" id="t"></div>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=t=>t?new Date(t).toISOString().slice(0,10):"";
async function api(r,b){const x=await fetch("api.php?r="+r,{method:b?"POST":"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined,credentials:"same-origin"});if(x.status===401)location.href="login.html";return{ok:x.ok,j:await x.json().catch(()=>({}))}}
async function load(){const r=await api("sa_list");if(!r.ok){document.getElementById("sum").innerHTML='<span class="bad">Not allowed. Add your email to CRM_SUPERADMINS on the hosting.</span>';return}
 const L=r.j,act=L.filter(w=>w.status==="active").length;document.getElementById("sum").textContent=L.length+" companies · "+L.filter(w=>w.plan==="trial").length+" on trial · "+L.filter(w=>["starter","growth"].includes(w.plan)).length+" paying · "+L.reduce((a,w)=>a+w.leads,0)+" leads in total";
 document.getElementById("t").innerHTML='<table><tr><th>Company</th><th>Plan</th><th>Status</th><th>Users</th><th>Leads</th><th>Trial ends</th><th>Paid until</th><th>Joined</th><th></th></tr>'+L.map(w=>`<tr data-id="${w.id}"><td><b>${esc(w.name)}</b></td><td><select class="pl">${["trial","starter","growth","internal"].map(p=>`<option ${w.plan===p?"selected":""}>${p}</option>`).join("")}</select></td><td><select class="st">${["active","suspended"].map(p=>`<option ${w.status===p?"selected":""}>${p}</option>`).join("")}</select></td><td>${w.users}</td><td>${w.leads}</td><td class="mut">${w.plan==="trial"?d(w.trialEnds):"—"}</td><td><input type="date" class="vu" value="${d(w.validUntil)}"></td><td class="mut">${d(w.createdAt)}</td><td><button class="p sv">Save</button> <button class="x7">+7d trial</button> <button class="x30">+30d trial</button></td></tr>`).join("")+"</table>"}
document.addEventListener("click",async e=>{const tr=e.target.closest("tr[data-id]");if(!tr)return;const id=tr.dataset.id;
 if(e.target.classList.contains("sv")){const r=await api("sa_update",{id,plan:tr.querySelector(".pl").value,status:tr.querySelector(".st").value,validUntil:tr.querySelector(".vu").value});if(!r.ok)alert(r.j.error||"Error");load()}
 else if(e.target.classList.contains("x7")||e.target.classList.contains("x30")){await api("sa_update",{id,extendDays:e.target.classList.contains("x7")?7:30});load()}});
load();</script></body></html>
