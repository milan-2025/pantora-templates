<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><base href="/CRM/"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LeadFlow CRM – Log in</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2563eb"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--bd:#e3e6ea;--ac:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--bd:#2b323b;--ac:#6ea0ff}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;width:min(340px,92vw)}h1{font-size:20px;margin:0 0 14px}
input,button{width:100%;font:inherit;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);box-sizing:border-box}
button{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer}#er{color:#dc2626;min-height:18px}</style></head><body>
<form id="f"><h1>LeadFlow CRM</h1><input id="e" type="email" placeholder="Email" required autocomplete="username"><input id="p" type="password" placeholder="Password" required autocomplete="current-password"><div id="er"></div><button>Log in</button></form>
<script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const r=await fetch("api.php?r=login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("e").value,password:document.getElementById("p").value})});if(r.ok)location.href="index.html";else document.getElementById("er").textContent="Wrong email or password."};</script></body></html>
