<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><base href="/CRM/"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Start your free trial – LeadFlow CRM</title>
<style>:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--bd:#e3e6ea;--ac:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--bd:#2b323b;--ac:#6ea0ff}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;width:min(380px,100%)}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 14px;color:#6b7280;font-size:13px}
input,button{width:100%;font:inherit;padding:11px;margin-bottom:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);box-sizing:border-box}
button{background:var(--ac);color:#fff;border-color:var(--ac);cursor:pointer;font-weight:600}#er{color:#dc2626;min-height:18px;font-size:13px}.hp{position:absolute;left:-9999px}a{color:var(--ac)}</style></head><body>
<form id="f"><h1>Start your free trial</h1><p>14 days free. No card needed. Your leads, your team, one place.</p>
<input id="c" placeholder="Company name" required maxlength="80"><input id="n" placeholder="Your name" required maxlength="60" autocomplete="name"><input id="e" type="email" placeholder="Work email" required autocomplete="username"><input id="p" type="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="new-password">
<input class="hp" id="w" tabindex="-1" autocomplete="off" aria-hidden="true"><div id="er"></div><button id="b">Create my account</button><div style="text-align:center"><a href="login.html">I already have an account</a></div></form>
<script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const b=document.getElementById("b"),er=document.getElementById("er");b.disabled=true;er.textContent="";
const r=await fetch("api.php?r=signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({company:c.value,name:n.value,email:document.getElementById("e").value,password:p.value,website:w.value})});
if(r.ok)location.href="index.html";else{const j=await r.json().catch(()=>({}));er.textContent=j.error||"Something went wrong. Please try again.";b.disabled=false}};</script></body></html>
