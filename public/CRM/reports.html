<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reports · LeadFlow CRM</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="re.css">
<script src="/CRM/offline.js" defer></script></head>
<body>
<div id="app"><div class="msg">Loading…</div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(r,x)=>{const res=await fetch("api.php?r="+r+(x||""),{credentials:"same-origin"});
  if(res.status===401){location.href="login.html";throw new Error("auth")}
  const j=await res.json().catch(()=>({}));if(!res.ok)throw new Error(j.error||"Something went wrong");return j};
const inr=n=>n>=1e7?"₹"+(+(n/1e7).toFixed(2))+" Cr":n>=1e5?"₹"+(+(n/1e5).toFixed(2))+" L":"₹"+Math.round(n||0).toLocaleString("en-IN");
const RANGES=[[7,"7 days"],[30,"30 days"],[90,"90 days"],[0,"All time"]];
let me,days=+(localStorage.getItem("re_rdays")||30);
async function init(){
  try{me=await api("me")}catch(e){return}
  if(!me.ws||me.ws.mode!=="realestate"||me.role!=="admin"){$("#app").innerHTML=`<div class="msg"><p>${me.ws&&me.ws.mode==="realestate"?"Reports are for admins.":"Reports are part of Real estate mode."}</p><a href="./">← Back to leads</a></div>`;return}
  await load()}
async function load(){
  $("#app").innerHTML=head()+`<div class="msg">Loading…</div>`;wire();
  try{const q=days?`&from=${Date.now()-days*864e5}&to=${Date.now()+6e4}`:"";const r=await api("report",q);draw(r)}catch(e){$("#app").innerHTML=head()+`<div class="msg">${esc(e.message)}</div>`;wire()}
}
const head=()=>`<div class="top"><a class="btn sm" href="./">← Leads</a><h1>📊 Reports</h1></div><div class="chips">${RANGES.map(r=>`<button data-d="${r[0]}" class="${days===r[0]?"on":""}">${r[1]}</button>`).join("")}</div>`;
function wire(){document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{days=+b.dataset.d;localStorage.setItem("re_rdays",days);load()})}
const tbl=(cols,rows,empty)=>rows.length?`<table class="t"><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</table>`:`<div class="mut" style="padding:6px 0">${empty}</div>`;
function draw(r){
  const t=r.totals,tile=(v,l,c)=>`<div class="stat" style="--c:${c}"><b style="font-size:19px">${v}</b><span>${l}</span></div>`;
  let h=head();
  h+=`<div class="mut" style="margin:-2px 0 8px">Leads received in this period, followed through to visits and bookings.</div>
  <div class="stats">${tile(t.leads,"Leads","#2563eb")}${tile(t.visitsDone,"Site visits done","#ea580c")}${tile(t.booked,"Booked","#0891b2")}${tile(t.conversion+"%","Lead to booking","#16a34a")}${tile(inr(t.soldValue),"Booked value","#7c3aed")}${tile(inr(t.commissionDue),"Commission owed","#d97706")}</div>`;
  h+=`<div class="sec">Funnel</div><div class="card">${r.funnel.map(f=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(f.label)}</span><span><b>${f.count}</b> <span class="mut" style="display:inline">${f.pct}%</span></span></div><div class="bar"><i style="width:${f.pct}%"></i></div></div>`).join("")}${t.lost?`<div class="mut">${t.lost} lead${t.lost>1?"s":""} marked Lost in this period.</div>`:""}</div>`;
  h+=`<div class="sec">Where leads come from</div>`+tbl([["Source",x=>esc(x.name)],["Leads",x=>x.leads],["Visits",x=>x.visits],["Booked",x=>x.booked],["Conv.",x=>x.conversion+"%"],["Value",x=>inr(x.value)]],r.sources,"No leads in this period.");
  h+=`<div class="sec">Projects</div>`+tbl([["Project",x=>esc(x.name)],["Units",x=>x.total],["Free",x=>x.available],["Held",x=>x.held],["Booked",x=>x.booked],["Sold",x=>x.sold],["Booked value",x=>inr(x.soldValue)],["Leads",x=>x.leads],["Page views",x=>x.views],["Enquiries",x=>x.enquiries]],r.projects,"No projects yet.")+`<div class="mut">Unit counts and booked value are as of today. Leads are for this period.</div>`;
  h+=`<div class="sec">Sales team</div>`+tbl([["Agent",x=>esc(x.name)],["Leads",x=>x.leads],["Visits",x=>x.visits],["Booked",x=>x.booked],["Conv.",x=>x.conversion+"%"],["Value",x=>inr(x.value)]],r.agents,"No leads in this period.");
  if(r.partners.length)h+=`<div class="sec">Channel partners</div>`+tbl([["Partner",x=>esc(x.name)],["Leads",x=>x.leads],["Booked",x=>x.booked],["Conv.",x=>x.conversion+"%"],["Value",x=>inr(x.value)],["Due",x=>inr(x.due)],["Paid",x=>inr(x.paid)]],r.partners,"");
  h+=`<div class="mut" style="margin-top:14px">How this is counted: a lead’s furthest stage comes from its current stage and its site visits. Leads marked Lost keep credit only for visits they had.</div>`;
  $("#app").innerHTML=h;wire();
}
init();
</script>
</body>
</html>
