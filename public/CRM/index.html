<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><base href="/CRM/"><meta name="robots" content="noindex,nofollow">

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:19px;margin:0}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:40px}
button,.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;min-height:40px;font-weight:500}
.btn.p,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.wa{background:#16a34a;color:#fff;border-color:#16a34a}.btn.call{background:#2563eb;color:#fff;border-color:#2563eb}
.btn.dg{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}

.st b{display:block;font-size:22px}.st span{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:5}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bd{background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-left:5px}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd)}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mut)}.sc{overflow-x:auto}

.tl div{border-left:2px solid var(--bd);padding:2px 0 8px 10px;font-size:13px}.mut,.tl small{color:var(--mut)}.od{color:var(--bad);font-weight:600}.msg{padding:30px;text-align:center;color:var(--mut)}
.menu .btn{width:100%;margin-bottom:8px;justify-content:flex-start}

.lead.sel{outline:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}.cb{font-size:18px;margin-right:6px}

.bulk select,.bulk input{flex:1 1 120px;min-width:0}body.selmode .wrap{padding-bottom:170px}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:var(--bg);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}.dt small{color:var(--mut);display:block}
</style></head><body>
<div class="wrap"><header><h1>LeadFlow CRM</h1><div style="display:flex;gap:6px"><button class="p" data-act="add">+ Add lead</button><button data-act="menu">☰ Menu</button></div></header><div id="app"><div class="msg">Loading…</div></div></div><div id="bulk"></div>

<script>
const ST={New:"#2563eb",Contacted:"#7c3aed",Qualified:"#0d9488",Proposal:"#ea580c",Won:"#16a34a",Lost:"#6b7280"},STAGES=Object.keys(ST);

let imps=[],rules=null,vws=LS.g("views",[]),me={name:"",role:"agent"},labels={},showTeam=LS.g("showteam",false),fp="",pend=false,selMode=false,sel=new Set(),lastVis=[],showN=LS.g("shownotes",true),db,leads=[],team=[],tpls=null,tab="today",q="",fs="",fo="",fc=new Set(),fsr=new Set(),dd="",imp=null,cols=LS.g("cols",["phone","campaign","owner","follow","created"]);
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const wa=p=>{let d=String(p||"").replace(/\D/g,"");if(d.length===10)d="91"+d;return"https://wa.me/"+d};
const ck=l=>l.campaign||l.source||"Unknown",tl=()=>tpls&&tpls.list&&tpls.list.length?tpls.list:DEF,open_=h=>{$("#md").innerHTML=h;$("#ov").classList.add("open")},close=()=>$("#ov").classList.remove("open");
const chip=(t,c)=>`<span class="chip" style="--c:${c}">${esc(t)}</span>`,done=l=>l.status==="Won"||l.status==="Lost";

const dur=ms=>{const m=Math.round(ms/6e4);return m<60?m+"m":m<1440?Math.round(m/60)+"h":Math.round(m/1440)+"d"},ft=l=>l.firstAt?{}:{firstAt:Date.now(),firstBy:me.name};

 if(k==="created")return esc(fmt(l.created));if(k.startsWith("x:"))return esc((l.extra||{})[k.slice(2)]);return esc(l[k])};

(async()=>{
 try{const r=await fetch("api.php?r=me");if(r.status===401){location.href="login.html";return}me=await r.json();db=makeDb()}catch(e){}
 if(!db){$("#app").innerHTML='<div class="msg">Could not reach the server.</div>';return}
 db.collection("leads").onSnapshot(s=>{leads=s.docs.map(d=>({id:d.id,...d.data()}));leads.sort((a,b)=>(b.created||0)-(a.created||0));render();checkAlerts()},e=>{$("#app").innerHTML='<div class="msg">Could not load ('+esc(e.message)+')</div>'});

})();

function card(l,full){
 const m=full?cols.map(k=>{const v=fv(l,k);return v?`<span><i>${esc(lbl(k))}:</i> ${v}</span>`:""}).join(""):`<span>${esc(l.phone)}</span>`;
 return `<div class="lead${sel.has(l.id)?" sel":""}" data-act="lead" data-id="${l.id}" style="--c:${ST[l.status]||"#999"}"><div class="lt"><b>${selMode?`<span class="cb">${sel.has(l.id)?"☑":"☐"}</span>`:""}${esc(l.name)||"(no name)"}</b>${chip(l.status,ST[l.status]||"#999")}</div><div class="lm">${full?wait(l)+pr(l):""}${m}</div>${full&&showN&&(l.notes||[]).length?`<div class="nts">${l.notes.slice(0,2).map(n=>`<div><small>${fmt(n.t)}${n.by?" · "+esc(n.by):""}</small> ${esc(String(n.x).slice(0,140))}</div>`).join("")}</div>`:""}${full&&l.phone?`<div class="lb"><a class="btn call sm" href="tel:${esc(l.phone)}">📞 Call</a><a class="btn wa sm" target="_blank" rel="noopener" href="${wa(l.phone)}">WhatsApp</a></div>`:""}</div>`;
}

 return `<div class="dd"><button data-act="dd" data-v="${id}">${label}: ${set.size?set.size+" selected":"All"} ▾</button>${dd===id?`<div class="pnl"><button class="btn sm" data-act="clr" data-v="${id}">Show all</button>${opts.map(([o,n])=>`<label class="ck"><input type="checkbox" data-ck="${id}" data-v="${esc(o)}" ${set.has(o)?"checked":""}><span>${esc(o)} <span class="mut">(${n})</span></span></label>`).join("")}</div>`:""}</div>`;
}
function render(){
 if(!db)return;
 const cnt=(f)=>{const m={};leads.forEach(l=>{const k=f(l);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
 const vis=leads.filter(l=>(!fc.size||fc.has(ck(l)))&&(!fsr.size||fsr.has(l.source||"Unknown"))&&(!fo||l.owner===fo)&&(!pend||pnd(l))&&(!fp||l.prio===fp)&&(tab!=="leads"||!fs||l.status===fs)&&(!q||JSON.stringify(l).toLowerCase().includes(q)));
 lastVis=vis;const t=td(),due=vis.filter(l=>fst(l)>0),over=vis.filter(l=>fst(l)===2),today=vis.filter(l=>fst(l)===1),fresh=vis.filter(l=>l.status==="New"&&!l.follow);
 document.title=(due.length?"("+due.length+") ":"")+"LeadFlow CRM";const S=[["Leads",vis.length,"#2563eb"],["Untouched",vis.filter(l=>l.status==="New").length,"#7c3aed"],["Overdue",over.length,"#dc2626"],["Due today",today.length,"#d97706"],["Won",vis.filter(l=>l.status==="Won").length,"#16a34a"]];
 let h='<div class="stats">'+S.map(s=>`<div class="st" style="--c:${s[2]}"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")+"</div>";
 h+='<div class="tabs">'+[["today","Today"],["leads","All leads"],["board","Pipeline"],["cal","Calendar"],["camp","Campaigns"],...(showTeam&&me.role==="admin"?[["team","Team"]]:[])].map(x=>`<button class="${tab===x[0]?"on":""}" data-act="tab" data-v="${x[0]}">${x[1]}${x[0]==="today"&&due.length?`<span class="bd">${due.length}</span>`:""}</button>`).join("")+"</div>";
 h+=`<div class="bar"><input id="q" placeholder="Search…" value="${esc(q)}">${tab==="leads"?`<select id="fs"><option value="">All stages</option>${STAGES.map(s=>`<option ${fs===s?"selected":""}>${s}</option>`).join("")}</select>`:""}<select id="fo"><option value="">Everyone</option>${team.map(s=>`<option ${fo===s?"selected":""}>${esc(s)}</option>`).join("")}</select>${viewsH()}<select id="fp"><option value="">Any priority</option>${["Hot","Warm","Cold"].map(p=>`<option ${fp===p?"selected":""}>${p}</option>`).join("")}</select><button data-act="pd" class="${pend?"p":""}">⚡ Pending today <span class="bd" style="background:${pend?"#fff":"var(--bad)"};color:${pend?"var(--ac)":"#fff"}">${leads.filter(pnd).length}</span></button><button data-act="selm" class="${selMode?"p":""}">☑ Select</button><button data-act="tn">📝 Notes: ${showN?"On":"Off"}</button>${ddh("c","Campaign / event",cnt(ck),fc)}${ddh("s","Source",cnt(l=>l.source||"Unknown"),fsr)}</div>`;

  h+=Object.keys(m).length?'<div class="sc"><table><tr><th>Campaign / event</th><th>Leads</th><th>Qualified</th><th>Won</th><th>Lost</th><th>Won %</th></tr>'+Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>`<tr><td>${esc(k)}</td><td>${o.n}</td><td>${o.q}</td><td style="color:var(--ok)">${o.w}</td><td class="mut">${o.l}</td><td>${Math.round(o.w/o.n*100)}%</td></tr>`).join("")+"</table></div>":'<div class="msg">Nothing to show yet.</div>';}
